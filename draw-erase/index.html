<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>그리고 지우세요</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../types/room-shim.js" data-game="draw"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#7cc8ff,#d4f1ff);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:50%;top:50%;width:960px;height:600px;transform-origin:center;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,40,90,.35);touch-action:none;background:#8fd3ff}
#gl{position:absolute;left:0;top:0;width:960px!important;height:600px!important;display:block}
.hidden{display:none!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;color:#fff;font-size:20px;padding:10px 16px;border-bottom:5px solid rgba(0,0,0,.25);transition:transform .08s}
button:active{transform:translateY(3px);border-bottom-width:2px}
#lobby{background:rgba(255,253,246,.55)}
.title{font-size:64px;line-height:1;text-shadow:0 4px 0 rgba(255,255,255,.9),0 7px 0 rgba(0,0,0,.15)}
.title .t1{color:#ff4f9a}.title .t2{color:#2f80ed}
.sub{font-size:20px;color:#37474f;margin:6px 0 14px;background:rgba(255,255,255,.8);padding:2px 14px;border-radius:12px}
.lobbyRow{display:flex;gap:18px}
.panel{background:#fff;border:4px solid #263238;border-radius:18px;padding:14px;box-shadow:0 6px 0 #263238}
.panel.left{width:250px;display:flex;flex-direction:column;align-items:center}
.panel.right{width:480px}
#preview{width:200px;height:200px;background:linear-gradient(#cfeeff,#fff);border-radius:12px;border:3px solid #cfe3ef}
.panel label,.lbl{font-size:19px;color:#263238;margin:8px 0 6px;display:block}
#nameIn{font-family:inherit;font-size:22px;width:200px;text-align:center;padding:6px;border:3px solid #263238;border-radius:10px;outline:none}
.coins{font-size:24px;margin-top:10px;color:#b37800;background:#fff4cc;border-radius:12px;padding:4px 14px;border:3px solid #f2c94c}
.btnRow{display:flex;gap:10px}
.opt{flex:1;background:#b0bec5;font-size:22px}
.opt.on[data-team=draw]{background:#ff4f9a}
.opt.on[data-team=erase]{background:#2f80ed}
.opt.on[data-mode]{background:#27ae60}
#eqInfo{font-size:18px;line-height:1.3;color:#37474f;background:#f3f7fa;border-radius:10px;padding:6px 12px;min-height:44px}
#eqInfo small{font-size:14px;color:#607d8b}
.big{font-size:24px;padding:12px 18px;flex:1;margin-top:12px}
.go{background:#27ae60}.shop{background:#f2994a}
.help{margin-top:14px;font-size:16px;color:#37474f;background:rgba(255,255,255,.8);padding:2px 14px;border-radius:12px}
#shop{background:#fffaf0;justify-content:flex-start;padding:18px}
.shopHead{display:flex;align-items:center;gap:16px;width:100%}
.stitle{font-size:36px;color:#e67e22}
.tabs{display:flex;gap:6px;flex:1}
.tab{background:#b0bec5;font-size:18px;padding:8px 12px}
.tab.on{background:#e67e22}
.skinGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:12px;width:100%}
.card.scard{height:158px;padding:5px}
.card.scard img{width:100px;height:70px}
.card.scard .nm{font-size:18px}
.card.scard .ds{font-size:12.5px;height:30px}
.card.scard button{font-size:15px;padding:5px 6px}
.shopHead .coins{margin:0}
#shopClose{background:#78909c;margin:0;flex:none;font-size:18px;padding:8px 12px}
.shopCols{display:flex;gap:20px;margin-top:10px;width:100%}
.shopCols>div{flex:1}
.shopCols h3{margin:4px 0 8px;font-weight:normal;font-size:26px;color:#263238}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border:4px solid #263238;border-radius:14px;padding:8px;text-align:center;box-shadow:0 5px 0 #263238;height:205px;display:flex;flex-direction:column;align-items:center}
.card.eq{border-color:#27ae60;box-shadow:0 5px 0 #27ae60;background:#effcf3}
.card img{width:100px;height:70px}
.card .nm{font-size:21px;color:#263238;white-space:nowrap}
.card .ds{font-size:14px;color:#607d8b;height:38px;line-height:1.3;margin:2px 0}
.card button{font-size:18px;padding:6px 12px;width:100%;margin-top:auto}
.buy{background:#f2994a}.equip{background:#2f80ed}.equipped{background:#27ae60}.cant{background:#b0bec5}
#match{background:rgba(38,50,56,.9);color:#fff}
.mTitle{font-size:44px;margin-bottom:24px}
.mRow{display:flex;align-items:center;gap:30px}
.mTeam{width:330px;background:rgba(255,255,255,.1);border-radius:18px;padding:14px;min-height:280px}
.mTeam h3{margin:0 0 10px;font-weight:normal;font-size:28px;text-align:center}
.mTeam.draw h3{color:#ff8cc0}.mTeam.erase h3{color:#7fb8ff}
.slot{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:22px;display:flex;justify-content:space-between;align-items:center;animation:pop .3s}
.slot.me{background:#f2c94c;color:#263238}
.slot.wait{color:rgba(255,255,255,.4);animation:blink 1s infinite}
.slot small{font-size:16px;opacity:.85}
.vs{font-size:60px;color:#f2c94c}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes blink{50%{opacity:.4}}
#hud{position:absolute;inset:0;pointer-events:none}
.hudTop{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px}
#timer{width:70px;height:70px;border-radius:50%;background:#263238;color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;border:4px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#timer.hurry{background:#e53935;animation:blink .5s infinite}
.bar{position:relative;width:520px;height:40px;background:#7fb8ff;border:4px solid #263238;border-radius:20px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#barDraw{position:absolute;left:0;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#ff4f9a,#c86bff);transition:width .15s}
.bar span{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#pDraw{left:14px}#pErase{right:14px}
.bar .mid{position:absolute;left:50%;top:0;bottom:0;width:3px;background:rgba(255,255,255,.8)}
#myTeam{position:absolute;top:92px;left:50%;transform:translateX(-50%);font-size:18px;color:#263238;background:rgba(255,255,255,.9);padding:3px 14px;border-radius:12px}
#banner{position:absolute;top:130px;left:50%;transform:translateX(-50%);font-size:28px;color:#fff;background:rgba(38,50,56,.85);padding:8px 22px;border-radius:16px;white-space:nowrap;opacity:0;transition:opacity .2s}
#banner.show{opacity:1}
#abil{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:19px;background:rgba(255,255,255,.92);border:3px solid #263238;border-radius:14px;padding:6px 16px;color:#263238}
#mini{position:absolute;left:12px;bottom:12px;width:192px;height:120px;border:4px solid #263238;border-radius:10px;background:#fffdf6;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:140px;color:#fff;-webkit-text-stroke:6px #263238;background:rgba(38,50,56,.2)}
#joy{position:absolute;width:100px;height:100px;margin:-50px 0 0 -50px;border-radius:50%;background:rgba(38,50,56,.15);border:3px solid rgba(38,50,56,.4)}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(242,201,76,.9)}
#result{background:rgba(255,253,246,.75)}
.rBox{background:#fff;border:4px solid #263238;border-radius:22px;box-shadow:0 8px 0 #263238;padding:20px 30px;width:620px;text-align:center}
#rTitle{font-size:52px}
#rCoin{font-size:26px;color:#b37800;margin:4px 0 10px}
.rBar{position:relative;height:44px;border-radius:22px;overflow:hidden;background:#7fb8ff;border:4px solid #263238;margin:8px 0 14px}
#rBarDraw{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff4f9a,#c86bff)}
.rBar span{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#rD{left:14px}#rE{right:14px}
#rank{text-align:left;font-size:19px;color:#37474f;max-height:190px;overflow:auto}
.rk{display:flex;justify-content:space-between;padding:5px 12px;border-radius:10px}
.rk.me{background:#fff4cc}
.rBtns{display:flex;gap:12px;margin-top:10px}
.rBtns button{flex:1}
.again{background:#27ae60}.home{background:#78909c}
#rotBtn{position:absolute;right:10px;bottom:10px;z-index:50;width:54px;height:54px;padding:0;border-radius:50%;background:#263238;font-size:26px;border:3px solid #fff;border-bottom:5px solid rgba(0,0,0,.4)}
#rotTip{position:absolute;right:72px;bottom:18px;z-index:50;background:rgba(38,50,56,.9);color:#fff;font-size:20px;padding:8px 14px;border-radius:12px;white-space:nowrap}
#hubHud{position:absolute;inset:0;pointer-events:none}
.hubPanel{position:absolute;left:10px;top:10px;width:224px;background:rgba(255,255,255,.93);border:3px solid #263238;border-radius:16px;padding:10px 10px 12px;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 5px 0 rgba(38,50,56,.5)}
.hubTitle{font-size:25px;white-space:nowrap;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.12)}.hubTitle .t1{color:#ff4f9a}.hubTitle .t2{color:#2f80ed}
.hubPanel label{font-size:15px;color:#455a64;margin:2px 0 0}
.hubPanel #nameIn{width:190px;font-size:19px;padding:4px}
.hubPanel .coins{margin-top:2px;font-size:20px;padding:2px 12px}
.hubPanel #eqInfo{font-size:14px;line-height:1.25;min-height:0;width:100%;padding:5px 8px;text-align:center}
.hubPanel #eqInfo small{font-size:12px}
.hubPanel #shopBtn{width:100%;font-size:19px;padding:7px 10px;margin:2px 0 0;flex:none}
#hubMsg{position:absolute;top:12px;left:calc(50% + 110px);transform:translateX(-50%);font-size:21px;background:rgba(38,50,56,.86);color:#fff;padding:8px 18px;border-radius:14px;white-space:nowrap;text-align:center}
#hubMsg b{color:#ffe066;font-weight:normal}
#hubNet{position:absolute;right:12px;bottom:12px;font-size:16px;background:rgba(255,255,255,.92);padding:4px 12px;border-radius:12px;color:#263238;border:2px solid #263238}
#err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;color:#263238;background:#fff;text-align:center;padding:40px}
</style>
</head>
<body>
<div id="stage">
  <button id="rotBtn" class="hidden" title="화면 방향 바꾸기">🔄</button>
  <div id="rotTip" class="hidden"></div>
  <div id="hud" class="hidden">
    <div class="hudTop">
      <div id="timer">40</div>
      <div class="bar"><div id="barDraw"></div><div class="mid"></div><span id="pDraw">🖌️ 50%</span><span id="pErase">50% 🧽</span></div>
    </div>
    <div id="myTeam"></div>
    <div id="banner"></div>
    <canvas id="mini" width="192" height="120"></canvas>
    <div id="abil" class="hidden"></div>
    <div id="count" class="hidden">3</div>
    <div id="joy" class="hidden"><div id="knob"></div></div>
  </div>

  <div id="hubHud" class="hidden">
    <div class="hubPanel">
      <div class="hubTitle"><span class="t1">그리고</span> <span class="t2">지우세요</span></div>
      <label>✏️ 닉네임 (10글자까지)</label>
      <input id="nameIn" maxlength="10" autocomplete="off">
      <div class="coins">🪙 <b id="coinL">0</b></div>
      <div id="eqInfo"></div>
      <button id="shopBtn" class="shop">🛒 상점</button>
    </div>
    <div id="hubMsg"></div>
    <div id="hubNet"></div>
  </div>

  <div id="lobby" class="screen hidden">
    <div class="title"><span class="t1">그리고</span> <span class="t2">지우세요</span></div>
    <div class="sub">🖌️ 칠하는 팀 vs 지우는 팀 🧽 · 40초 동안 더 많이 차지하면 승리!</div>
    <div class="lobbyRow">
      <div class="panel left">
        <canvas id="preview" width="400" height="400"></canvas>

      </div>
      <div class="panel right">
        <div class="lbl">1. 팀 고르기</div>
        <div class="btnRow">
          <button class="opt" data-team="draw">🖌️ 그리기 팀</button>
          <button class="opt" data-team="erase">🧽 지우기 팀</button>
        </div>
        <div class="lbl">2. 몇 대 몇으로 할까요?</div>
        <div class="btnRow">
          <button class="opt" data-mode="1">1 : 1</button>
          <button class="opt" data-mode="2">2 : 2</button>
          <button class="opt" data-mode="3">3 : 3</button>
        </div>
        <div class="btnRow">
          <button id="playBtn" class="big go">▶ 매칭 시작!</button>
        </div>
      </div>
    </div>
    
  </div>

  <div id="shop" class="screen hidden">
    <div class="shopHead">
      <div class="stitle">🛒 상점</div>
      <div class="tabs">
        <button class="tab" data-tab="tools">🧰 도구</button>
        <button class="tab" data-tab="eskin">🧽 지우개 스킨</button>
        <button class="tab" data-tab="bskin">🖌️ 붓 스킨</button>
      </div>
      <div class="coins">🪙 <b id="coinS">0</b></div>
      <button id="shopClose">← 돌아가기</button>
    </div>
    <div id="shopTools" class="shopCols">
      <div><h3>🧽 지우개</h3><div id="shopE" class="cards"></div></div>
      <div><h3>🖌️ 붓</h3><div id="shopB" class="cards"></div></div>
    </div>
    <div id="shopSkins" class="skinGrid hidden"></div>
  </div>

  <div id="match" class="screen hidden">
    <div class="mTitle" id="mTitle">🔍 매칭 중...</div>
    <div class="mRow">
      <div class="mTeam draw"><h3>🖌️ 그리기 팀</h3><div id="mDraw"></div></div>
      <div class="vs">VS</div>
      <div class="mTeam erase"><h3>🧽 지우기 팀</h3><div id="mErase"></div></div>
    </div>
  </div>

  <div id="result" class="screen hidden">
    <div class="rBox">
      <div id="rTitle">🎉 승리!</div>
      <div id="rCoin"></div>
      <div class="rBar"><div id="rBarDraw"></div><span id="rD"></span><span id="rE"></span></div>
      <div id="rank"></div>
      <div class="rBtns">
        <button class="big again" id="againBtn">🔁 한 판 더!</button>
        <button class="big home" id="homeBtn">🏠 로비로</button>
      </div>
    </div>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
if(!window.THREE){$('stage').insertAdjacentHTML('beforeend','<div id="err">3D를 불러오지 못했어요 😢<br>인터넷 연결을 확인하고 새로고침해 주세요.</div>');return;}
const W=960,H=600,CS=10,GW=W/CS,GH=H/CS,TOTAL=GW*GH;
const PAPER='#f4ecda';
const COLORS=[null],colIdx={};
function ci(h){if(colIdx[h]===undefined){colIdx[h]=COLORS.length;COLORS.push(h);}return colIdx[h];}
const TEAM_COLS=[ci('#ff4f9a'),ci('#9b5cff'),ci('#ff9f1c')];
const RAINBOW_HEX=['#e53935','#fb8c00','#fdd835','#43a047','#1e88e5','#3949ab','#8e24aa'];
const RAINBOW=RAINBOW_HEX.map(ci);

// ---------- 스킨 ----------
const SKINS=[
  {id:'none',name:'기본',price:0,kind:'none',emo:'✨'},
  {id:'red',name:'빨강',price:20,kind:'color',hex:'#e53935',emo:'🔴'},
  {id:'orange',name:'주황',price:20,kind:'color',hex:'#fb8c00',emo:'🟠'},
  {id:'yellow',name:'노랑',price:20,kind:'color',hex:'#fdd835',emo:'🟡'},
  {id:'green',name:'초록',price:20,kind:'color',hex:'#43a047',emo:'🟢'},
  {id:'blue',name:'파랑',price:20,kind:'color',hex:'#1e88e5',emo:'🔵'},
  {id:'brown',name:'갈색',price:20,kind:'color',hex:'#8d6e63',emo:'🟤'},
  {id:'white',name:'하양',price:20,kind:'color',hex:'#ffffff',emo:'⚪'},
  {id:'black',name:'검정',price:20,kind:'color',hex:'#2b2b2b',emo:'⚫'},
  {id:'cat',name:'고양이',price:50,kind:'shape',hex:'#ff9f43',light:'#ffc48a',emo:'🐱',
   mask:['1.......1','11.....11','111111111','111111111','11.111.11','111111111','1111.1111','.1111111.','..11111..']},
  {id:'dog',name:'강아지',price:50,kind:'shape',hex:'#8d6e63',light:'#d9bfb3',emo:'🐶',
   mask:['..11.11..','..11.11..','11.....11','11.111.11','..11111..','.1111111.','.1111111.','..11111..','.........']},
  {id:'duck',name:'오리',price:50,kind:'shape',hex:'#f9c800',light:'#ffe680',emo:'🦆',
   mask:['..111....','.11.11...','.1111111.','..111....','..111...1','.11111111','111111111','.1111111.','..11111..']},
  {id:'boat',name:'배',price:50,kind:'shape',hex:'#1e88e5',light:'#9ccbff',emo:'⛵',
   mask:['....1....','....11...','....111..','....1111.','....1....','111111111','.1111111.','..11111..','.........']},
  {id:'heart',name:'하트',price:50,kind:'shape',hex:'#ff4f9a',light:'#ffb0d0',emo:'💖',
   mask:['.11...11.','1111.1111','111111111','111111111','.1111111.','..11111..','...111...','....1....','.........']},
  {id:'star',name:'별',price:50,kind:'shape',hex:'#ffb300',light:'#ffdc7a',emo:'⭐',
   mask:['....1....','....1....','...111...','111111111','.1111111.','..11111..','..11.11..','.11...11.','.1.....1.']},
  {id:'rainbow',name:'무지개',price:80,kind:'rainbow',emo:'🌈'}
];
const SKIN={};SKINS.forEach(s=>SKIN[s.id]=s);
function paintFor(sk,def){
  const S=SKIN[sk]||SKIN.none;
  if(S.kind==='color')return{type:'solid',main:ci(S.hex)};
  if(S.kind==='rainbow')return{type:'rainbow',main:RAINBOW[0]};
  if(S.kind==='shape')return{type:'shape',main:ci(S.hex),light:ci(S.light),mask:S.mask};
  return{type:'solid',main:def};
}
function paintVal(p,gx,gy){return p.type==='rainbow'?RAINBOW[((gx+gy)/3|0)%7]:p.type==='shape'?p.light:p.main;}
const GAME_TIME=40, ABIL_CD=10, ABIL_LEN=2, WIN_COIN=30;
const BOT_NAMES=['Suoeu228','delu207','dofu086','flgor1936','qwwr3658','mnj342','cbfg8675','poli1435'];

// ---------- 아이템 ----------
const ITEMS={
  erase:[
    {id:'e0',name:'기본 지우개',price:0,r:22,sp:170,desc:'평범하고 든든한 지우개'},
    {id:'e1',name:'왕 지우개',price:80,r:40,sp:170,desc:'한 번에 아주 많이 지워요!'},
    {id:'e2',name:'스피드 지우개',price:80,r:27,sp:320,desc:'슝슝! 엄청 빨리 달리며 지워요'},
    {id:'e3',name:'아이스 지우개',price:150,r:22,sp:170,ab:'ice',desc:'10초마다 상대 팀을 2초 동안 꽁꽁 얼려요'}
  ],
  draw:[
    {id:'b0',name:'기본 붓',price:0,r:22,sp:170,desc:'평범하고 든든한 붓'},
    {id:'b1',name:'왕 붓',price:80,r:40,sp:170,desc:'한 번에 아주 많이 칠해요!'},
    {id:'b2',name:'스피드 붓',price:80,r:27,sp:320,desc:'슝슝! 엄청 빨리 달리며 칠해요'},
    {id:'b3',name:'최면술 붓',price:150,r:22,sp:170,ab:'hypno',desc:'10초마다 지우개 팀이 2초 동안 칠하게 돼요'}
  ]
};
const itemById=id=>ITEMS.erase.concat(ITEMS.draw).find(i=>i.id===id);

let AC=null;
function beep(f,d=.12,type='square',v=.05){
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}
}
const tune=(notes,gap=.12)=>notes.forEach((n,i)=>setTimeout(()=>beep(n,.18,'triangle',.07),i*gap*1000));

const paint=document.createElement('canvas');paint.width=W;paint.height=H;const pctx=paint.getContext('2d');

const WHITE_IDX=ci('#ffffff');
function setCell(i,v){grid[i]=v;pctx.fillStyle=v?COLORS[v]:PAPER;pctx.fillRect((i%GW)*CS,((i/GW)|0)*CS,CS,CS);
  if(!v||v===WHITE_IDX){pctx.strokeStyle=v?'rgba(120,150,180,.25)':'rgba(38,50,56,.07)';pctx.strokeRect((i%GW)*CS+.5,((i/GW)|0)*CS+.5,CS-1,CS-1);}dirty=true;}
function mkRng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function initBoard(seed){
  const rg=mkRng(seed==null?(Math.random()*1e9)|0:seed);
  const r=()=>rg()*6.28,f=()=>.08+rg()*.12;
  const P=[r(),r(),r(),r(),r()],F=[f(),f(),f(),f()];
  const vals=new Float32Array(TOTAL);
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)
    vals[y*GW+x]=Math.sin(x*F[0]+P[0])+Math.sin(y*F[1]+P[1])+Math.sin((x+y)*F[2]+P[2])+Math.sin((x-y)*F[3]+P[3]);
  const med=Float32Array.from(vals).sort()[TOTAL>>1];
  painted=0;
  for(let i=0;i<TOTAL;i++){
    if(vals[i]>med){const x=i%GW,y=(i/GW)|0;setCell(i,TEAM_COLS[(((Math.sin(x*.07+P[4])+Math.cos(y*.09))*1.5+3)|0)%3]);painted++;}
    else setCell(i,0);
  }
}

function skinBody(sk,plainCol,sleeveCol){
  const g=new THREE.Group(),S=SKIN[sk]||SKIN.none;
  const box=(w,h,d,c,x=0,y=0,z=0)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);g.add(m);return m;};
  const eyes=(y,z)=>{box(.12,.12,.05,'#263238',-.25,y,z);box(.12,.12,.05,'#263238',.25,y,z);};
  if(S.kind==='none'||S.kind==='color'){
    const col=S.kind==='color'?S.hex:plainCol;
    box(1.3,.7,.9,col);box(.6,.74,.94,S.id==='blue'?'#ffffff':sleeveCol,-.35,0,0);
  }else if(sk==='cat'){
    box(1.2,.8,.9,S.hex);
    [-.35,.35].forEach(x=>{const c=new THREE.Mesh(new THREE.ConeGeometry(.22,.4,4),M(S.hex));c.position.set(x,.58,0);c.rotation.y=Math.PI/4;g.add(c);});
    eyes(.08,.46);box(.12,.08,.05,'#ff7f9e',0,-.1,.46);
    box(.5,.04,.03,'#263238',-.45,-.12,.46).rotation.z=.15;box(.5,.04,.03,'#263238',.45,-.12,.46).rotation.z=-.15;
  }else if(sk==='dog'){
    box(1.1,.8,.9,S.hex);box(.25,.65,.55,'#5d4037',-.66,-.05,0);box(.25,.65,.55,'#5d4037',.66,-.05,0);
    eyes(.1,.46);box(.5,.3,.2,'#e6d6ce',0,-.15,.5);box(.18,.12,.08,'#263238',0,-.05,.62);
  }else if(sk==='duck'){
    box(1.1,.55,.8,S.hex,.1,-.12,0);box(.3,.25,.6,S.hex,.65,.08,0);
    const h=new THREE.Mesh(new THREE.SphereGeometry(.32,16,12),M(S.hex));h.position.set(-.3,.42,0);g.add(h);
    const bk=new THREE.Mesh(new THREE.ConeGeometry(.13,.35,8),M('#ff8f00'));bk.rotation.z=Math.PI/2;bk.position.set(-.72,.38,0);g.add(bk);
    box(.08,.08,.05,'#263238',-.42,.52,.28);box(.08,.08,.05,'#263238',-.42,.52,-.28);
  }else if(sk==='boat'){
    box(1.4,.35,.7,S.hex,0,-.2,0);box(1.1,.2,.55,S.hex,0,-.42,0);box(1.25,.06,.6,'#8d6e63',0,0,0);
    const mast=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,1.1,8),M('#ffffff'));mast.position.set(0,.55,0);g.add(mast);
    const sh=new THREE.Shape();sh.moveTo(0,0);sh.lineTo(.55,0);sh.lineTo(0,.8);sh.closePath();
    const sail=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:.04,bevelEnabled:false}),M('#ffffff'));sail.position.set(.05,.2,0);g.add(sail);
    box(.25,.14,.03,'#e53935',.12,1.05,0);
  }else if(sk==='heart'){
    const m=extrudeShape(heartShape(),S.hex);m.scale.setScalar(1.1);g.add(m);
  }else if(sk==='star'){
    const m=extrudeShape(starShape(),S.hex);m.scale.setScalar(1.15);g.add(m);
  }else if(sk==='rainbow'){
    RAINBOW_HEX.forEach((c,i)=>box(1.3,.11,.9,c,0,.33-i*.11,0));
  }
  return g;
}

    if(item.id==='e1'){body.scale.setScalar(1.6);for(let k=0;k<3;k++){const c=new THREE.Mesh(new THREE.ConeGeometry(.22,.55,4),M('#f2c94c'));c.position.set(-.4+k*.4,.95,0);g.add(c);}}

function applyTool(c){

function botThink(b,dt){

const NET={room:null,me:'solo',peers:[],pres:{},patch:{},lastSend:0,dirty:true};
const playedG=new Set();
function netInit(){(async()=>{try{
  if(!window.claude||!window.claude.use)return;
  const room=await window.claude.use('room');if(!room)return;NET.room=room;
  room.onPeers(ch=>{const L=Array.isArray(ch)?ch:((ch&&ch.peers)||[]);NET.peers=L;const me=L.find(p=>p.isMe&&p.sameTab);if(me)NET.me=me.peer;});
  if(room.onConnection)room.onConnection(c=>{NET.conn=c;});
  NET.dirty=true;
}catch(e){console.log('[온라인 꺼짐]',e);}})();}
function netSet(patch){for(const k in patch){if(patch[k]===null)delete NET.pres[k];else NET.pres[k]=patch[k];NET.patch[k]=patch[k];}NET.dirty=true;}
function netFlush(now){
  if(!NET.room)return;
  if((NET.dirty&&now-NET.lastSend>120)||now-NET.lastSend>1500){
    const out=Object.assign({},NET.patch,NET.pres);NET.patch={};NET.dirty=false;NET.lastSend=now;
    try{const r=NET.room.presence(out);if(r&&r.catch)r.catch(()=>{});}catch(e){}
  }
}
function others(){const out=[];for(const x of NET.peers){if(x.isMe&&x.sameTab)continue;if(x.kind&&x.kind!=='viewer')continue;if(!x.presence||!x.presence.st)continue;out.push({peer:x.peer,p:x.presence});}return out;}
function presOf(id){if(id===NET.me)return NET.pres;const o=others().find(q=>q.peer===id);return o?o.p:null;}
// 게임 안에서 지금 있는 사람 중 아이디가 가장 작은 사람이 컴퓨터 친구를 움직이고 시간을 맞춰요
function amHost(){return hostId()===NET.me;}
function hostId(){if(!game)return NET.me;let best=NET.me;for(const e of game.roster){if(e.bot||!e.id||e.id===NET.me)continue;const p=presOf(e.id);if(p&&p.gid===game.gid&&e.id<best)best=e.id;}return best;}
function hostPres(){return presOf(hostId());}
function netFollow(c,dt){
  let tx=null;
  if(c.peer){const p=presOf(c.peer);if(p&&p.gid===game.gid&&p.x!=null){tx=p.x;c.ty=p.y;c.targetAng=p.a;c.moving=!!p.m;c.frozenNet=p.f;}else c.moving=false;}
  else if(c.bot){const h=hostPres();const b=h&&h.gid===game.gid&&h.b&&h.b[c.bi];if(b){tx=b[0];c.ty=b[1];c.targetAng=b[2];c.moving=!!b[3];}else c.moving=false;}
  if(tx!=null){c.tx=tx;}
  if(c.tx!=null){const k=Math.min(1,dt*10);c.x+=(c.tx-c.x)*k;c.y+=(c.ty-c.y)*k;}
  if(c.moving)c.walk+=dt*11;
}
function gameNet(dt){
  if(!player)return;
  const pat={x:player.x|0,y:player.y|0,a:+(player.targetAng||0).toFixed(2),m:player.moving?1:0};
  if(game.startClearT>0){game.startClearT-=dt;if(game.startClearT<=0)pat.start=null;}
  if(amHost()){pat.b=chars.filter(c=>c.bot).map(c=>[c.x|0,c.y|0,+(c.targetAng||0).toFixed(2),c.moving?1:0]);pat.tl=+timeLeft.toFixed(1);}
  else{const h=hostPres();if(h&&h.gid===game.gid&&typeof h.tl==='number'&&state==='play'&&Math.abs(h.tl-timeLeft)>.6)timeLeft=h.tl;if(NET.pres.b)pat.b=null;}
  const p0=NET.pres;if(p0.x!==pat.x||p0.y!==pat.y||p0.m!==pat.m||pat.b||pat.start===null||p0.a!==pat.a)netSet(pat);
}

function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

function hubSpawn(x,y){
  matchTimers.forEach(clearTimeout);matchTimers=[];
  state='hub';game=null;clearChars();initBoardBlank();curPad=null;cdMine={};hubRemote=new Map();hubSig='';
  $('hud').classList.add('hidden');$('count').classList.add('hidden');show('none');
  player=makeHubChar({name:(save.name||'뉴비'),isPlayer:true},save.team,save.eq[save.team],save.skin[save.team]);
  player.x=x;player.y=y;chars=[player];refreshLobby();
  netSet({st:'hub',gid:null,b:null,tl:null,res:null,start:null,q:null,pad:null,n:save.name||'뉴비',t:save.team,it:save.eq[save.team],sk:save.skin[save.team],x:x|0,y:y|0,a:0,m:0});
  snapCam();
}
function initBoardBlank(){grid=new Uint8Array(TOTAL);painted=0;}
function makeHubChar(p,team,itemId,skin){const c=makeChar({name:p.name,isPlayer:!!p.isPlayer,item:itemById(itemId)||ITEMS[team][0],skin:skin||'none'},team,0,1);c.speed=210;c.ring.visible=false;c.disc.visible=false;return c;}
function rebuildHubPlayer(team){
  if(!player||state!=='hub')return;team=team||player.team;
  const x=player.x,y=player.y,a=player.ang;scene.remove(player.m.root,player.ring,player.disc);
  const np=makeHubChar({name:save.name||'뉴비',isPlayer:true},team,save.eq[team],save.skin[team]);np.x=x;np.y=y;np.ang=a;np.targetAng=a;
  chars[chars.indexOf(player)]=np;player=np;netSet({t:team,it:save.eq[team],sk:save.skin[team],n:save.name||'뉴비'});
}
function hubMembers(m){
  const L=[];
  if(curPad&&curPad.mode===m)L.push({id:NET.me,t:curPad.team,n:save.name||'뉴비',it:save.eq[curPad.team],sk:save.skin[curPad.team]});
  for(const o of others()){const p=o.p;if(p.st!=='hub'||!p.pad||+p.pad[1]!==m)continue;const t=p.pad[0]==='d'?'draw':'erase';L.push({id:o.peer,t,n:String(p.n||'친구').slice(0,10),it:itemById(p.it)&&itemById(p.it).id||ITEMS[t][0].id,sk:p.sk||'none'});}
  return L.sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);
}
function hubUpdate(dt){
  if(!player)return;
  const shopOpen=!$('shop').classList.contains('hidden');
  let [mx,my]=shopOpen?[0,0]:playerInput();
  player.moving=Math.hypot(mx,my)>.1;
  if(player.moving){player.walk+=dt*11;player.targetAng=Math.atan2(mx,my);}
  player.x=Math.max(10,Math.min(W-10,player.x+mx*player.speed*dt));player.y=Math.max(10,Math.min(H-10,player.y+my*player.speed*dt));
  // 칸 확인
  const pad=padAt(player.x,player.y);
  if(pad!==curPad){curPad=pad;if(pad){beep(700,.1);if(pad.team!==player.team){save.team=pad.team;persist();rebuildHubPlayer(pad.team);refreshLobby();}}netSet({pad:pad?pad.id:null});}
  const pat={x:player.x|0,y:player.y|0,a:+(player.targetAng||0).toFixed(2),m:player.moving?1:0};
  if(NET.pres.x!==pat.x||NET.pres.y!==pat.y||NET.pres.m!==pat.m)netSet(pat);
  // 다른 사람들
  const seen=new Set();
  for(const o of others()){const p=o.p;if(p.st!=='hub'||p.x==null)continue;seen.add(o.peer);
    let c=hubRemote.get(o.peer);const t=p.t==='erase'?'erase':'draw';const key=t+'|'+p.it+'|'+p.sk+'|'+p.n;
    if(!c||c.key!==key){if(c){scene.remove(c.m.root,c.ring,c.disc);chars.splice(chars.indexOf(c),1);}c=makeHubChar({name:String(p.n||'친구').slice(0,10)},t,p.it,p.sk);c.key=key;c.x=p.x;c.y=p.y;hubRemote.set(o.peer,c);chars.push(c);}
    c.tx=p.x;c.ty=p.y;c.targetAng=p.a;c.moving=!!p.m;const k=Math.min(1,dt*10);c.x+=(c.tx-c.x)*k;c.y+=(c.ty-c.y)*k;if(c.moving)c.walk+=dt*11;}
  for(const [id,c] of hubRemote)if(!seen.has(id)){scene.remove(c.m.root,c.ring,c.disc);chars.splice(chars.indexOf(c),1);hubRemote.delete(id);}
  // 매칭: 같은 모드 칸에 있는 사람 중 아이디가 가장 작은 사람이 시작 신호를 보내요
  const now=performance.now(),info={};
  for(const m of [1,2,3]){
    const L=hubMembers(m);
    L.forEach(e=>{const id=(e.t==='draw'?'d':'e')+m;info[id]=info[id]||{n:0,cd:null};info[id].n++;});
    if(!L.length){delete cdMine[m];continue;}
    const leader=L[0].id;let cd=null;
    if(leader===NET.me){
      if(!cdMine[m])cdMine[m]=now+6000;
      const full=L.filter(e=>e.t==='draw').length>=m&&L.filter(e=>e.t==='erase').length>=m;
      if(full)cdMine[m]=Math.min(cdMine[m],now+2000);
      cd=Math.max(0,Math.ceil((cdMine[m]-now)/1000));
      if(NET.pres.q==null||NET.pres.q[0]!==m||NET.pres.q[1]!==cd)netSet({q:[m,cd]});
      if(now>=cdMine[m]){delete cdMine[m];launchMatch(m,L);return;}
    }else{delete cdMine[m];const lp=presOf(leader);if(lp&&lp.q&&lp.q[0]===m)cd=lp.q[1];}
    if(cd!=null)PADS.filter(p=>p.mode===m).forEach(p=>{info[p.id]=info[p.id]||{n:0,cd:null};info[p.id].cd=cd;});
  }
  if(NET.pres.q!=null&&!(curPad&&L0(curPad.mode)))netSet({q:null});
  // 누가 나를 넣어서 시작했는지 확인
  if(curPad)for(const o of others()){const S=o.p.start;if(S&&S.g&&!playedG.has(S.g)&&Array.isArray(S.r)&&S.r.some(e=>e.id===NET.me)){enterMatch(S);return;}}
  const sig=JSON.stringify(info);if(sig!==hubSig){hubSig=sig;drawHub(info);}
  // 안내
  const online=others().length;
  $('hubNet').textContent=NET.room?`🌐 같이 접속한 친구 ${online}명`:'🌐 혼자 하기 (컴퓨터 친구)';
  let msg='🚶 걸어서 <b>매칭 칸</b>에 들어가 보세요!';
  if(curPad){const I=info[curPad.id]||{};msg=`${curPad.team==='draw'?'🖌️ 그리기':'🧽 지우기'} 팀 ${curPad.mode}:${curPad.mode} 칸! `+(I.cd!=null?`<b>${I.cd}초 뒤 시작</b>`:'잠깐만 기다려요')+' · 빈자리는 컴퓨터 친구가 채워요';}
  if($('hubMsg').innerHTML!==msg)$('hubMsg').innerHTML=msg;
}
function L0(m){const L=hubMembers(m);return L.length&&L[0].id===NET.me;}
function launchMatch(m,L){
  const draws=L.filter(e=>e.t==='draw').slice(0,m),erases=L.filter(e=>e.t==='erase').slice(0,m);
  const taken=new Set(L.map(e=>e.n));const names=BOT_NAMES.filter(n=>!taken.has(n)).sort(()=>Math.random()-.5);
  const bot=t=>({id:null,bot:1,n:names.pop()||'뉴비봇',t,it:pickBotItem(t).id,sk:pickBotSkin()});
  const r=[];draws.forEach(e=>r.push({id:e.id,n:e.n,t:'draw',it:e.it,sk:e.sk}));while(r.filter(e=>e.t==='draw').length<m)r.push(bot('draw'));
  erases.forEach(e=>r.push({id:e.id,n:e.n,t:'erase',it:e.it,sk:e.sk}));while(r.filter(e=>e.t==='erase').length<m)r.push(bot('erase'));
  const S={g:NET.me+'-'+Date.now().toString(36),s:(Math.random()*1e9)|0,m,r};
  netSet({start:S,q:null});enterMatch(S);
}

// ---------- 3D 그리기 ----------
const camTarget=new THREE.Vector3(),camPos=new THREE.Vector3();
function camWanted(){
  const [wx,wz]=toW(player.x,player.y);
  camTarget.set(wx,1.5,wz);
  camPos.set(wx,24*camDist,wz+21*camDist);
}
function snapCam(){camWanted();camera.position.copy(camPos);camera.lookAt(camTarget);}
const lookNow=new THREE.Vector3();
function syncChars(dt){
  const now=performance.now();
  for(const c of chars){
    const [wx,wz]=toW(c.x,c.y),m=c.m;
    m.root.position.set(wx,0,wz);
    if(c.targetAng!==undefined){let d=c.targetAng-c.ang;d=Math.atan2(Math.sin(d),Math.cos(d));c.ang+=d*Math.min(1,dt*12);}
    m.root.rotation.y=c.ang;
    const s=c.moving&&c.frozen<=0?Math.sin(c.walk):0;
    m.legL.rotation.x=s*.7;m.legR.rotation.x=-s*.7;m.armL.rotation.x=-s*.7;
    m.armR.rotation.x=-.9+(c.moving?Math.sin(c.walk*2)*.12:0);
    m.root.position.y=c.moving?Math.abs(s)*.15:0;
    c.ring.position.set(wx,.06,wz);c.disc.position.set(wx,.05,wz);
    c.ice.visible=c.frozen>0;
    c.spin.visible=c.hypno>0;if(c.hypno>0)c.spin.material.rotation=now/150;
  }
}
const mini=$('mini').getContext('2d');
function drawMini(){
  mini.drawImage(paint,0,0,192,120);
  for(const c of chars){
    mini.beginPath();mini.arc(c.x/5,c.y/5,c.isPlayer?5:3.5,0,7);
    mini.fillStyle=c.isPlayer?'#f2c94c':c.team==='draw'?'#c2185b':'#1565c0';mini.fill();
    mini.lineWidth=1.5;mini.strokeStyle='#263238';mini.stroke();
  }
}
function render(dt){
  if(dirty){boardTex.needsUpdate=true;dirty=false;}
  if(state==='hub'&&player){camWanted();const k=Math.min(1,dt*6);camera.position.lerp(camPos,k);lookNow.lerp(camTarget,k);camera.lookAt(lookNow);syncChars(dt);}
  else if(state==='lobby'||state==='match'||state==='shop'||state==='result'||!player){
    lobbyAng+=dt*.08;
    camera.position.set(Math.sin(lobbyAng)*70,45,Math.cos(lobbyAng)*55);camera.lookAt(0,0,0);
  }else{
    camWanted();
    const k=Math.min(1,dt*6);
    camera.position.lerp(camPos,k);lookNow.lerp(camTarget,k);camera.lookAt(lookNow);
    syncChars(dt);drawMini();
  }
  renderer.render(scene,camera);
  if(!$('lobby').classList.contains('hidden')&&pModel){pModel.root.rotation.y=Math.sin(performance.now()/1200)*.6;pv.render(pScene,pCam);}
}

// ---------- 화면 맞추기 ----------
let rotated=false;
function fit(){
  const portrait=innerHeight>innerWidth*1.05;
  rotated=portrait&&save.rot!=='none'?save.rot:false; // 세로 화면이면 고른 방향으로 눕혀서 가로로 보여 줘요
  const vw=rotated?innerHeight:innerWidth,vh=rotated?innerWidth:innerHeight;
  const s=Math.min(vw/W,vh/H)*(rotated?1:.98);
  const st=$('stage');
  st.style.transform=`translate(-50%,-50%) ${rotated==='cw'?'rotate(90deg) ':rotated==='ccw'?'rotate(-90deg) ':''}scale(${s})`;
  $('rotBtn').classList.toggle('hidden',!portrait);
  st.style.borderRadius=rotated?'0':'18px';
  renderer.setPixelRatio(Math.min(2,(window.devicePixelRatio||1)*s));renderer.setSize(W,H,false);
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));fit();
const ROT_NEXT={cw:'ccw',ccw:'none',none:'cw'},ROT_MSG={cw:'↪️ 휴대폰을 왼쪽으로 돌려서 하기',ccw:'↩️ 휴대폰을 오른쪽으로 돌려서 하기',none:'📱 세운 채로 하기'};
let rotTipT=null;
$('rotBtn').onclick=e=>{e.stopPropagation();save.rot=ROT_NEXT[save.rot];persist();fit();beep(700);
  const t=$('rotTip');t.textContent=ROT_MSG[save.rot];t.classList.remove('hidden');clearTimeout(rotTipT);rotTipT=setTimeout(()=>t.classList.add('hidden'),2200);};

// ---------- 입력 ----------
addEventListener('keydown',e=>{if(document.activeElement===nameIn)return;keys[e.code]=true;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});
const glc=renderer.domElement;
function pt(e){const r=glc.getBoundingClientRect();if(rotated==='cw')return[(e.clientY-r.top)/r.height*W,(r.right-e.clientX)/r.width*H];if(rotated==='ccw')return[(r.bottom-e.clientY)/r.height*W,(e.clientX-r.left)/r.width*H];return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];}
function showJoy(){const j=$('joy');if(!joy){j.classList.add('hidden');return;}j.classList.remove('hidden');j.style.left=joy.sx+'px';j.style.top=joy.sy+'px';
  let dx=joy.cx-joy.sx,dy=joy.cy-joy.sy;const d=Math.hypot(dx,dy);if(d>50){dx=dx/d*50;dy=dy/d*50;}$('knob').style.transform=`translate(${dx}px,${dy}px)`;}
glc.addEventListener('pointerdown',e=>{if(state!=='play'&&state!=='count'&&state!=='hub')return;if(document.activeElement===nameIn)nameIn.blur();const[x,y]=pt(e);joy={sx:x,sy:y,cx:x,cy:y,id:e.pointerId};try{glc.setPointerCapture(e.pointerId);}catch(_){}showJoy();});
glc.addEventListener('pointermove',e=>{if(joy&&e.pointerId===joy.id){const[x,y]=pt(e);joy.cx=x;joy.cy=y;showJoy();}});
const endJoy=e=>{if(joy&&e.pointerId===joy.id){joy=null;showJoy();}};
glc.addEventListener('pointerup',endJoy);glc.addEventListener('pointercancel',endJoy);
glc.addEventListener('wheel',e=>{e.preventDefault();camDist=Math.max(.6,Math.min(1.6,camDist+(e.deltaY>0?.08:-.08)));},{passive:false});

// ---------- 루프 ----------
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render(dt);requestAnimationFrame(loop);}
refreshLobby();hubSpawn(480,300);netInit();
window.__de={get player(){return player;},get state(){return state;},get NET(){return NET;},get chars(){return chars;},get painted(){return painted;},get game(){return game;},skip(t){timeLeft=t;}};
requestAnimationFrame(loop);
})();

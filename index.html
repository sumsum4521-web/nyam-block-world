<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#7cc7ff;font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block}
.out{text-shadow:-2px -2px 0 #1b1f3a,2px -2px 0 #1b1f3a,-2px 2px 0 #1b1f3a,2px 2px 0 #1b1f3a,0 3px 0 #1b1f3a}
.hide{display:none!important}
button{font-family:inherit;cursor:pointer;border:none}
.btn{background:#3bb54a;color:#fff;font-size:20px;padding:10px 18px;border-radius:14px;border:3px solid #1b1f3a;box-shadow:0 5px 0 #1b1f3a;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1b1f3a}
.btn.blue{background:#2f8cff}.btn.pink{background:#ff5fa2}.btn.gold{background:#ffb52e}.btn.gray{background:#8a93a8}.btn.purple{background:#9b5cff}.btn.red{background:#ff5050}
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#stats{position:absolute;left:12px;top:12px;background:rgba(27,31,58,.72);border:3px solid #1b1f3a;border-radius:16px;padding:10px 14px;min-width:230px}
#pname{font-size:18px;color:#ffe066}
#sizeTxt{font-size:34px;line-height:1.1}
#sizeTxt small{font-size:18px;color:#b9c4ff}
.bar{height:22px;background:#2a2f55;border:3px solid #1b1f3a;border-radius:12px;overflow:hidden;position:relative;margin:6px 0}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#7dff8a,#2fc24a);transition:width .2s}
.bar>b{position:absolute;inset:0;text-align:center;font-size:14px;line-height:16px;font-weight:normal}
.bar.full>i{background:linear-gradient(#ffd166,#ff8f2e);animation:pulse .6s infinite alternate}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.35)}}
#coinTxt{font-size:24px;color:#ffe066}
#boosts{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
#boosts span{background:#1b1f3a;border-radius:10px;padding:2px 8px;font-size:15px}
#side{position:absolute;left:12px;top:220px;display:flex;flex-direction:column;gap:10px}
#side .btn{width:118px;font-size:18px;padding:8px 6px;text-align:left}
#side .btn.glow{animation:glow .5s infinite alternate}
@keyframes glow{from{transform:scale(1)}to{transform:scale(1.08);filter:brightness(1.3)}}
#questMini{position:absolute;left:142px;top:220px;width:230px;background:rgba(27,31,58,.72);border:3px solid #1b1f3a;border-radius:14px;padding:8px 10px;font-size:15px}
#questMini .qt{color:#ffe066;font-size:14px}
#lb{position:absolute;right:12px;top:12px;background:rgba(27,31,58,.72);border:3px solid #1b1f3a;border-radius:16px;padding:8px 12px;width:210px;font-size:15px}
#lb h3{font-weight:normal;font-size:18px;color:#ffe066;margin-bottom:4px}
#lb div{display:flex;justify-content:space-between;padding:1px 0}
#lb .me{color:#7dff8a}
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:30px;text-align:center;pointer-events:none;white-space:nowrap}
#hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:16px;background:rgba(27,31,58,.6);padding:6px 14px;border-radius:12px;pointer-events:none;white-space:nowrap}
#eatBtn{position:absolute;right:20px;bottom:24px;width:110px;height:110px;border-radius:50%;font-size:30px;background:#ff5fa2;border:4px solid #1b1f3a;box-shadow:0 6px 0 #1b1f3a;color:#fff}
#eatBtn small{display:block;font-size:13px}
#eatBtn.cool{background:#8a93a8}
#jumpBtn{position:absolute;right:140px;bottom:24px;width:80px;height:80px;border-radius:50%;font-size:20px;background:#2f8cff;border:4px solid #1b1f3a;box-shadow:0 6px 0 #1b1f3a;color:#fff}
#joy{position:absolute;left:30px;bottom:30px;width:130px;height:130px;border-radius:50%;background:rgba(27,31,58,.35);border:3px solid rgba(255,255,255,.5)}
#zoomBtns{position:absolute;right:20px;bottom:150px;display:flex;flex-direction:column;gap:8px}#zoomBtns .btn{width:56px;height:56px;padding:0;font-size:22px}
#joy i{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.75)}
.float{position:fixed;pointer-events:none;font-size:22px;white-space:nowrap;transform:translate(-50%,-50%)}
#modal{position:fixed;inset:0;background:rgba(10,12,30,.55);display:flex;align-items:center;justify-content:center;z-index:20}
#panel{background:#2b3166;border:4px solid #1b1f3a;border-radius:22px;width:min(640px,94vw);max-height:88vh;overflow:auto;padding:18px 20px;box-shadow:0 8px 0 #1b1f3a}
#panel h2{font-weight:normal;font-size:30px;margin-bottom:10px}
.x{float:right}
.row{display:flex;align-items:center;gap:12px;background:#3a4180;border:3px solid #1b1f3a;border-radius:14px;padding:10px 12px;margin:8px 0}
.row .ic{font-size:34px;width:44px;text-align:center}
.row .tx{flex:1;font-size:15px;color:#d8ddff}
.row .tx b{display:block;font-size:20px;color:#fff;font-weight:normal}
.row .btn{font-size:17px;padding:7px 12px;min-width:110px}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.sw button{width:40px;height:40px;border-radius:10px;border:3px solid #1b1f3a}
.sw button.on{outline:4px solid #ffe066}
.sw .hat{width:auto;height:auto;padding:6px 10px;background:#3a4180;color:#fff;font-size:16px}
.sw .hat.lock{opacity:.5}
label.l{font-size:18px;color:#ffe066}
input.t{font-family:inherit;font-size:20px;padding:8px 12px;border-radius:12px;border:3px solid #1b1f3a;width:220px;outline:none}
#title{position:fixed;inset:0;display:flex;align-items:center;justify-content:flex-start;z-index:10;pointer-events:none}
#tbox{pointer-events:auto;margin-left:5vw;background:rgba(43,49,102,.92);border:4px solid #1b1f3a;border-radius:24px;padding:14px 20px;width:min(460px,92vw);max-height:94vh;overflow:auto;box-shadow:0 8px 0 #1b1f3a}
#tbox h1{font-weight:normal;font-size:38px;line-height:1.05;color:#ffe066}
#tbox h1 span{display:block;font-size:24px;color:#fff}
#tbox p{font-size:14px;color:#d8ddff;margin:6px 0 8px}
#tbox .sw{margin:4px 0 6px;gap:6px}#tbox .sw button{width:32px;height:32px}#tbox .sw .hat{width:auto;height:auto;padding:4px 8px;font-size:14px}
.q{font-size:15px}
.q.done{color:#7dff8a}
@media (max-width:760px){#questMini{display:none}#lb{width:150px;font-size:13px}#stats{min-width:180px}#sizeTxt{font-size:26px}#side{top:190px}#side .btn{width:96px;font-size:15px}}
</style>
</head>
<body>
<div id="title">
  <div id="tbox">
    <h1 class="out">냠냠 블록 월드<span>먹고 먹고 또 먹어서 거인이 되자!</span></h1>
    <p>사탕부터 자동차, 집, 빌딩, 산까지! 나보다 작은 건 전부 냠냠 먹을 수 있어요. 배가 꽉 차면 코인으로 배를 키워요.</p>
    <label class="l">내 이름</label><br>
    <input class="t" id="nameIn" maxlength="10" value="채아"><br>
    <label class="l">얼굴·손 색</label><div class="sw" id="swSkin"></div>
    <label class="l">윗옷 색</label><div class="sw" id="swShirt"></div>
    <label class="l">바지 색</label><div class="sw" id="swPants"></div>
    <label class="l">표정</label><div class="sw" id="swFace"></div>
    <label class="l">모자</label><div class="sw" id="swHat"></div>
    <button class="btn" id="playBtn" style="font-size:26px;width:100%;margin-top:6px">▶ 놀러 가기!</button>
    <p id="saveInfo" style="margin-top:8px"></p>
    <button class="btn gold hide" id="restartBtn" style="width:100%;font-size:18px">🔄 처음부터 하기</button>
  </div>
</div>

<div id="hud" class="hide">
  <div id="stats">
    <div id="pname" class="out">채아</div>
    <div id="sizeTxt" class="out">2.0 <small>크기</small></div>
    <div class="bar" id="stomach"><i></i><b class="out">배 0 / 60</b></div>
    <div id="coinTxt" class="out">💰 0</div>
    <div id="boosts"></div>
  </div>
  <div id="side">
    <button class="btn gold" id="bShop">🛒 상점</button>
    <button class="btn pink" id="bLook">👕 꾸미기</button>
    <button class="btn purple" id="bCode">🎁 코드</button>
    <button class="btn blue" id="bQuest">📜 퀘스트</button>
    <button class="btn gray" id="bSet">⚙️ 설정</button>
  </div>
  <div id="questMini"></div>
  <div id="lb"></div>
  <div id="toast" class="out"></div>
  <div id="hint">WASD 걷기 · Space 점프 · E 냠! 큰 입 · 마우스 끌기 카메라 · 휠 확대</div>
  <button id="eatBtn" class="out">냠!<small>E</small></button>
  <button id="jumpBtn" class="out hide">점프</button>
  <div id="joy" class="hide"><i></i></div>
  <div id="zoomBtns" class="hide"><button class="btn blue" id="zIn">➕</button><button class="btn blue" id="zOut">➖</button></div>
</div>
<div id="floats"></div>
<div id="modal" class="hide"><div id="panel"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
// ================= 기본 도구 =================
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function fmt(n){n=Math.floor(n);if(n<10000)return n.toLocaleString();const u=[[1e16,'경'],[1e12,'조'],[1e8,'억'],[1e4,'만']];for(const[v,s]of u)if(n>=v){const x=n/v;return(x>=100?Math.floor(x):x.toFixed(1).replace(/\.0$/,''))+s}return ''+n}
function hasJong(s){const c=s.charCodeAt(s.length-1);if(c<0xAC00||c>0xD7A3)return false;return (c-0xAC00)%28!==0}
const iga=s=>s+(hasJong(s)?'이':'가');
const eul=s=>s+(hasJong(s)?'을':'를');
const sizeOf=M=>2*Math.cbrt(M/10);
const massOf=S=>10*Math.pow(S/2,3);
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

// ================= 소리 =================
let AC=null;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
let soundOn=true;
function tone(f,d,type,vol,slide){if(!AC||!soundOn)return;const t=AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}
let lastChomp=0;
const sfx={
 chomp(){const n=performance.now();if(n-lastChomp<70)return;lastChomp=n;tone(rnd(180,260),.08,'square',.05,90)},
 coin(){tone(990,.07,'square',.04);setTimeout(()=>tone(1320,.1,'square',.04),60)},
 boing(){tone(300,.25,'sine',.12,700)},
 buy(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.12,'square',.05),i*70))},
 big(){tone(120,.3,'sawtooth',.07,60)},
 power(){[400,600,900].forEach((f,i)=>setTimeout(()=>tone(f,.1,'triangle',.08),i*60))},
 full(){tone(220,.2,'triangle',.07,180)}
};

// ================= 장면 =================
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
const SKY=new THREE.Color(0x8fd3ff);
scene.background=SKY;
scene.fog=new THREE.Fog(SKY,120,400);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,6000);
const hemi=new THREE.HemisphereLight(0xdff3ff,0x6b8a4a,0.6);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,0.82);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.02;
scene.add(sun);scene.add(sun.target);
const SUNDIR=new THREE.Vector3(0.45,1,0.3).normalize();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

// 스터드(블록 돌기) 무늬
function studTex(base,dark){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,64,64);g.fillStyle=dark;g.fillRect(0,62,64,2);g.fillRect(62,0,2,64);g.beginPath();g.arc(32,34,15,0,7);g.fillStyle=dark;g.fill();g.beginPath();g.arc(32,31,15,0,7);g.fillStyle=base;g.fill();g.beginPath();g.arc(28,27,6,0,7);g.fillStyle='rgba(255,255,255,.25)';g.fill();const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t}
const WORLD_R=700;
function groundDisc(r0,r1,base,dark,y,rep){const geo=r0>0?new THREE.RingGeometry(r0,r1,96,1):new THREE.CircleGeometry(r1,96);const uv=geo.attributes.uv,pos=geo.attributes.position;for(let i=0;i<uv.count;i++){uv.setXY(i,pos.getX(i)/rep,pos.getY(i)/rep)}const tex=studTex(base,dark);const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({map:tex,polygonOffset:true,polygonOffsetFactor:-y*4,polygonOffsetUnits:-y*4}));m.rotation.x=-Math.PI/2;m.position.y=y*0.01;m.receiveShadow=true;scene.add(m);return m}
groundDisc(0,WORLD_R+20,'#4fae3c','#439a33',0,2);
groundDisc(0,58,'#ff8fbf','#f077aa',1,2);
groundDisc(228,425,'#868c99','#767c89',1,4);
groundDisc(425,WORLD_R+20,'#6fae4c','#5f9a40',1,6);
// 길(도시)
(function(){const mat=new THREE.MeshLambertMaterial({color:0x50545e,polygonOffset:true,polygonOffsetFactor:-8,polygonOffsetUnits:-8});for(let a=0;a<8;a++){const g=new THREE.PlaneGeometry(10,WORLD_R*2);const m=new THREE.Mesh(g,mat);m.rotation.x=-Math.PI/2;m.rotation.z=a*Math.PI/8;m.position.y=.03;m.receiveShadow=true;scene.add(m)}const ring=new THREE.Mesh(new THREE.RingGeometry(220,228,96),mat);ring.rotation.x=-Math.PI/2;ring.position.y=.03;scene.add(ring);const pc=new THREE.Mesh(new THREE.CircleGeometry(12,40),new THREE.MeshLambertMaterial({color:0xfff1a8,polygonOffset:true,polygonOffsetFactor:-10,polygonOffsetUnits:-10}));pc.rotation.x=-Math.PI/2;pc.position.y=.04;scene.add(pc)})();
// 바다
const sea=new THREE.Mesh(new THREE.RingGeometry(WORLD_R+20,5000,64),new THREE.MeshLambertMaterial({color:0x3aa0ff}));sea.rotation.x=-Math.PI/2;sea.position.y=-0.4;scene.add(sea);
// 구름
const clouds=[];(function(){const mat=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.92});for(let i=0;i<40;i++){const g=new THREE.Group();const n=ri(3,6);for(let j=0;j<n;j++){const b=new THREE.Mesh(new THREE.BoxGeometry(rnd(20,40),rnd(8,14),rnd(16,28)),mat);b.position.set(j*16-n*8,rnd(-3,3),rnd(-6,6));g.add(b)}const a=Math.random()*7,r=rnd(50,1100);g.position.set(Math.cos(a)*r,rnd(140,320),Math.sin(a)*r);g.userData.v=rnd(2,6);scene.add(g);clouds.push(g)}})();

// ================= 물건 모양 만들기 =================
const _m=new THREE.Matrix4(),_q=new THREE.Quaternion(),_e=new THREE.Euler(),_v=new THREE.Vector3(),_s=new THREE.Vector3(1,1,1);
class B{constructor(){this.parts=[]}
 add(g,c,x,y,z,rx,ry,rz,sx,sy,sz){_e.set(rx||0,ry||0,rz||0);_q.setFromEuler(_e);const m=new THREE.Matrix4().compose(new THREE.Vector3(x,y,z),_q.clone(),new THREE.Vector3(sx||1,sy||1,sz||1));this.parts.push({g,c:new THREE.Color(c),m});return this}
 box(w,h,d,x,y,z,c,ry,rx,rz){return this.add(new THREE.BoxGeometry(w,h,d),c,x,y,z,rx,ry,rz)}
 cyl(rt,rb,h,x,y,z,c,seg,rx,ry,rz){return this.add(new THREE.CylinderGeometry(rt,rb,h,seg||12),c,x,y,z,rx,ry,rz)}
 sph(r,x,y,z,c,sx,sy,sz,seg){return this.add(new THREE.SphereGeometry(r,seg||12,Math.max(6,(seg||12)*0.7|0)),c,x,y,z,0,0,0,sx,sy,sz)}
 cone(r,h,x,y,z,c,seg,rx){return this.add(new THREE.ConeGeometry(r,h,seg||12),c,x,y,z,rx||0)}
 torus(r,t,x,y,z,c,rx,ry){return this.add(new THREE.TorusGeometry(r,t,8,20),c,x,y,z,rx,ry)}
 build(){const P=[],N=[],C=[];for(const p of this.parts){let g=p.g.index?p.g.toNonIndexed():p.g.clone();g.applyMatrix4(p.m);const pa=g.attributes.position,na=g.attributes.normal;for(let i=0;i<pa.count;i++){P.push(pa.getX(i),pa.getY(i),pa.getZ(i));N.push(na.getX(i),na.getY(i),na.getZ(i));C.push(p.c.r,p.c.g,p.c.b)}}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(P,3));geo.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(C,3));geo.computeBoundingBox();geo.computeBoundingSphere();return geo}}

// 종류: name, cat(퀘스트 분류), col(부딪힘 비율), tint(색 바꾸기), build
const TYPES={
 lolly:{name:'막대사탕',cat:'candy',col:.3,tint:['#ff5fa2','#5fc8ff','#ffd23f','#9b5cff','#4cd964'],b:b=>b.cyl(.03,.03,.5,0,.25,0,'#ffffff',6).cyl(.2,.2,.07,0,.6,0,'#ffffff',16,Math.PI/2).cyl(.1,.1,.075,0,.6,0,'#ffe8f3',12,Math.PI/2)},
 donut:{name:'도넛',cat:'candy',col:.8,tint:['#ff8fc0','#7a4a2a','#fff3f8','#9be7ff'],b:b=>b.torus(.2,.09,0,.09,0,'#e0a35a',Math.PI/2).torus(.2,.07,0,.13,0,'#ffffff',Math.PI/2).box(.05,.02,.02,.12,.21,.05,'#ff4040',.5).box(.05,.02,.02,-.1,.21,-.08,'#40c0ff',1.2).box(.05,.02,.02,-.05,.21,.14,'#ffe040',2)},
 apple:{name:'사과',cat:'candy',col:.8,tint:['#ff3b3b','#7ddc3a','#ffd23f'],b:b=>b.sph(.22,0,.22,0,'#ffffff',1,.92,1).cyl(.02,.02,.12,0,.47,0,'#6b3f1d',5).box(.12,.02,.06,.07,.46,0,'#3bbf3b',0,0,.4)},
 cupcake:{name:'컵케이크',cat:'candy',col:.8,tint:['#ff8fc0','#fff1a8','#b9f2ff','#c8a2ff'],b:b=>b.cyl(.22,.16,.24,0,.12,0,'#5fb8ff',10).sph(.24,0,.3,0,'#ffffff',1,.7,1).sph(.06,0,.47,0,'#ff2b4a')},

// ================= 게임 규칙 =================
function edible(a,o){return o.alive&&o.size<=a.S*1.08}
function aabbDist(x,z,o){const dx=Math.max(0,Math.abs(x-o.x)-o.hw),dz=Math.max(0,Math.abs(z-o.z)-o.hd);return Math.hypot(dx,dz)}
function reachOf(a){return a.S*.42*(a.isP?UP.reach.val(D.up.reach):1)+a.S*.12}
function eatTime(a,o){const r=o.size/a.S;return clamp(.06+1.3*r*r,.05,1.6)/(a.isP?UP.eat.val(D.up.eat):1.1)}
function jump(a){if(a.grounded){a.vy=Math.sqrt(2*a.g()*a.S*.9);a.grounded=false}}
function bigMouth(a){if(a.bigCool>0)return;if(a.isP&&!playing)return;const R=a.S*2.6*(a.isP?UP.reach.val(D.up.reach):1);const near=query(a.x,a.z,R+20,[]);let n=0;for(const o of near){if(!edible(a,o)||o.pull||o.eater&&o.eater!==a)continue;if(aabbDist(a.x,a.z,o)>R)continue;o.pull=0.001;o.puller=a;o.px=o.x;o.pz=o.z;if(o.eater)removeEat(o);if(++n>40)break}
 a.bigCool=a.isP&&boostsOn.unlim>0?.4:3.5;if(a.isP){sfx.big();if(!n)toast('근처에 먹을 게 없어요!',900);burst(a.x+Math.sin(a.face)*a.S*.4,a.S*.9,a.z+Math.cos(a.face)*a.S*.4,'#ff5fa2',8,a.S*.06)}}
function removeEat(o){if(o.eater){const i=o.eater.eating.indexOf(o);if(i>=0)o.eater.eating.splice(i,1)}o.eater=null}
function consume(a,o){o.alive=false;o.prog=0;o.pull=0;removeEat(o);setMat(o);o.respawn=Math.min(150,8+o.size*1.6);deadList.push(o);
 const gain=o.value*(a.isP?UP.grow.val(D.up.grow)*rebMult()*(boostsOn.grow>0?2:1):1.2);
 const before=a.M;a.M=Math.min(a.maxMv(),a.M+gain);
 const cx=o.x,cz=o.z;
 if(a.isP){const coin=Math.max(1,Math.ceil(o.value*3*o.coin*rebMult()*(boostsOn.coin>0?2:1)));D.coins+=coin;count(o.T.cat);sfx.chomp();
  const grew=a.M-before;floatText(grew>0.0001?'+'+(grew<10?grew.toFixed(1):fmt(grew)):'💰+'+fmt(coin),cx,o.h*.7+a.S*.6,cz,grew>0?'#7dff8a':'#ffe066');
  if(o.size>a.S*.25||o.k==='gem'){floatText(o.T.name+' 냠!',cx,o.h+a.S*.9,cz,'#ffffff');if(o.k==='gem')sfx.coin()}
  if(a.M>=a.maxMv()-1e-6&&before<a.maxMv()-1e-6){toast('🍽️ 배가 꽉 찼어요! 상점에서 배 크기를 키워요',2600);sfx.full()}
  questCheck()}
 const col=o.im.instanceColor?new THREE.Color().fromArray(o.im.instanceColor.array,o.idx*3):new THREE.Color(1,1,1);
 burst(cx,Math.min(o.h*.6,a.S),cz,col.getStyle(),o.size>a.S*.3?7:3,Math.max(.06,Math.min(o.size,a.S)*.08))}
const deadList=[];

const tmpQ=[];
function moveAgent(a,mx,mz,dt){
 const ml=Math.hypot(mx,mz);let sp=(4.5+a.S*1.7)*(a.isP?UP.speed.val(D.up.speed)*(boostsOn.speed>0?1.6:1):a.speedB);
 if(ml>0.01){mx/=Math.max(1,ml);mz/=Math.max(1,ml);a.x+=mx*sp*dt;a.z+=mz*sp*dt;const tf=Math.atan2(mx,mz);let df=tf-a.face;df=Math.atan2(Math.sin(df),Math.cos(df));a.face+=df*Math.min(1,dt*12);a.phase+=Math.min(1,ml)*sp*dt/(a.S*.55)}else{a.phase*=.85}
 a.vy-=a.g()*dt;a.y+=a.vy*dt;if(a.y<=0){a.y=0;a.vy=0;a.grounded=true}
 // 부딪힘 (먹을 수 없는 큰 것)
 const rad=a.S*.28;const near=query(a.x,a.z,rad+2,tmpQ);
 for(const o of near){if(!o.alive||edible(a,o)||o.pull)continue;if(a.y>o.h*.92)continue;const cw=o.hw*o.T.col,cd=o.hd*o.T.col;const dx=a.x-o.x,dz=a.z-o.z;const px=clamp(dx,-cw,cw),pz=clamp(dz,-cd,cd);let ex=dx-px,ez=dz-pz;const d=Math.hypot(ex,ez);if(d<rad){if(d<1e-4){if(cw-Math.abs(dx)<cd-Math.abs(dz)){a.x=o.x+Math.sign(dx||1)*(cw+rad)}else{a.z=o.z+Math.sign(dz||1)*(cd+rad)}}else{a.x+=ex/d*(rad-d);a.z+=ez/d*(rad-d)}if(a.isP)lockNear=o}}
 const dd=Math.hypot(a.x,a.z);if(dd>WORLD_R){a.x*=WORLD_R/dd;a.z*=WORLD_R/dd}}
let lockNear=null;
function agentEat(a,dt){
 const R=reachOf(a);const near=query(a.x,a.z,R+2,tmpQ);
 for(const o of near){if(a.eating.length>=8)break;if(!edible(a,o)||o.eater||o.pull)continue;if(aabbDist(a.x,a.z,o)<R&&a.y<o.h+a.S*.5){o.eater=a;a.eating.push(o)}}
 for(let i=a.eating.length-1;i>=0;i--){const o=a.eating[i];if(!o.alive){a.eating.splice(i,1);continue}if(aabbDist(a.x,a.z,o)>R*1.4){o.eater=null;a.eating.splice(i,1);o.prog=Math.max(0,o.prog-.3);setMat(o,0,0,0,1-o.prog*.6);continue}
  o.prog+=dt/eatTime(a,o);if(o.prog>=1){a.eating.splice(i,1);o.eater=null;consume(a,o)}else{const w=Math.sin(o.prog*40)*.04;setMat(o,0,0,0,(1-o.prog*.65)*(1+w));if(a.isP&&Math.random()<dt*8)sfx.chomp()}}
 a.chew=a.eating.length>0?a.chew+dt:0}
function pullUpdate(dt){for(const o of objs){if(!o.pull)continue;const a=o.puller;o.pull+=dt/.35;const t=Math.min(1,o.pull);const mx=a.x+Math.sin(a.face)*a.S*.3,mz=a.z+Math.cos(a.face)*a.S*.3;const ox=(mx-o.x)*t*t,oz=(mz-o.z)*t*t,oy=a.S*1.5*t*t*(1-t)*2+a.S*.6*t*t;setMat(o,ox,oy,oz,1-t*.7,t*6);if(t>=1){consume(a,o)}}}
function bumpCheck(){for(let i=0;i<agents.length;i++)for(let j=i+1;j<agents.length;j++){let a=agents[i],b=agents[j];if(b.S>a.S){const t=a;a=b;b=t}if(a.S<b.S*1.3)continue;const d=Math.hypot(a.x-b.x,a.z-b.z);if(d>(a.S+b.S)*.3)continue;if(b.shield>0)continue;
 // 통! 작은 쪽이 튕겨 나가고 냠냠 별을 떨어뜨려요
 const lose=b.M*(b.isP&&!D.lose?0:.15);if(lose>0){b.M=Math.max(10,b.M-lose);dropOrbs(b.x,b.z,lose,b.S)}
 const ang=Math.atan2(b.x-a.x,b.z-a.z);b.x+=Math.sin(ang)*a.S*1.2;b.z+=Math.cos(ang)*a.S*1.2;b.vy=Math.sqrt(2*b.g()*b.S*1.5);b.grounded=false;b.shield=3;
 if(b.isP){sfx.boing();toast('통! '+iga(a.name)+' 부딪쳤어요'+(lose>0?' — 냠냠 별을 떨어뜨렸어요':''),2000)}
 else if(a.isP){sfx.boing();count('bump');toast('통! '+iga(b.name)+' 냠냠 별을 떨어뜨렸어요!',1800);questCheck()}
 b.target=null}}
function orbUpdate(dt){for(let i=orbs.length-1;i>=0;i--){const o=orbs[i];o.life-=dt;o.m.rotation.y+=dt*2;o.m.position.y=o.size/2+Math.sin(o.life*3)*o.size*.15;let eaten=false;if(o.life<=0){eaten=true}else for(const a of agents){if(a.S*1.1<o.size)continue;if(Math.hypot(a.x-o.m.position.x,a.z-o.m.position.z)<reachOf(a)+o.size*.5){a.M=Math.min(a.maxMv(),a.M+o.v*(a.isP?rebMult():1));if(a.isP){sfx.coin();D.coins+=Math.ceil(o.v*rebMult());floatText('⭐ +냠냠 별',o.m.position.x,a.S,o.m.position.z,'#ffe066')}eaten=true;break}}if(eaten){scene.remove(o.m);o.m.material.dispose();orbs.splice(i,1)}}}
function boostUpdate(dt,time){for(const it of boostItems){if(!it.g.visible){it.t-=dt;if(it.t<=0)placeBoost(it);continue}it.g.rotation.y+=dt*1.5;it.g.position.y=it.size*(1.1+Math.sin(time*2+it.r0)*.2);if(Math.hypot(P.x-it.g.position.x,P.z-it.g.position.z)<P.S*.5+it.size){boostsOn[it.k]=20;it.g.visible=false;it.t=35;sfx.power();toast(BOOSTS[it.k].ic+' '+BOOSTS[it.k].n+' 20초!',1600)}}
 for(const k in boostsOn){boostsOn[k]-=dt;if(boostsOn[k]<=0)delete boostsOn[k]}
 if(boostsOn.magnet>0){const R=P.S*4;const near=query(P.x,P.z,R,[]);let n=0;for(const o of near){if(!edible(P,o)||o.pull||o.eater||o.size>P.S*.5)continue;if(aabbDist(P.x,P.z,o)<R&&Math.random()<dt*3){o.pull=.001;o.puller=P;if(++n>6)break}}}}
function respawnUpdate(dt){for(let i=deadList.length-1;i>=0;i--){const o=deadList[i];o.respawn-=dt;if(o.respawn>0)continue;
  // 누군가 그 자리에 서 있으면 조금 기다려요
  let blocked=false;for(const a of agents){if(aabbDist(a.x,a.z,o)<a.S*.6&&o.size>a.S*.3){blocked=true;break}}if(blocked){o.respawn=3;continue}
  o.alive=true;o.pop=0;deadList.splice(i,1)}}
const popping=[];
function popUpdate(dt){for(const o of objs){if(o.pop<1&&o.alive){o.pop=Math.min(1,o.pop+dt*2.5);const t=o.pop;setMat(o,0,0,0,t<1?Math.sin(t*Math.PI*.5)*(1+Math.sin(t*Math.PI)*.15):1)}}}

// 친구들 생각하기
function botThink(b,dt){
 b.think-=dt;b.growT-=dt;
 if(b.growT<=0){b.growT=b.grow;b.maxM=Math.min(b.maxM*1.7,Math.max(massOf(P.S*1.6+3),massOf(5)));if(b.maxM<b.M)b.maxM=b.M}
 if(b.think<=0||!b.target||!b.target.alive||b.target.pull||(b.target.eater&&b.target.eater!==b)){b.think=rnd(.8,1.6);
  // 나보다 큰 친구가 가까우면 피하기
  let flee=null;for(const o of agents){if(o!==b&&o.S>b.S*1.3&&Math.hypot(o.x-b.x,o.z-b.z)<o.S*3+b.S*2){flee=o;break}}
  if(flee){const a=Math.atan2(b.x-flee.x,b.z-flee.z);b.target={fake:true,x:b.x+Math.sin(a)*b.S*10,z:b.z+Math.cos(a)*b.S*10,alive:true}}
  else{const R=Math.max(30,b.S*14);const near=query(b.x,b.z,R,[]);let best=null,bs=-1;for(const o of near){if(!edible(b,o)||o.eater||o.pull)continue;const d=Math.hypot(o.x-b.x,o.z-b.z)+1;const v=o.value/(d*d*0.02+1)*(o.size>b.S*.2?3:1);if(v>bs){bs=v;best=o}}
   if(best)b.target=best;else{const a=Math.random()*7;const d=clamp(Math.hypot(b.x,b.z)+rnd(-40,90),0,WORLD_R-20);const aa=Math.atan2(b.z,b.x)+rnd(-.8,.8);b.target={fake:true,x:Math.cos(aa)*d,z:Math.sin(aa)*d,alive:true}}}}
 const t=b.target;let mx=t.x-b.x,mz=t.z-b.z;const d=Math.hypot(mx,mz);if(d<(t.fake?2:reachOf(b)*.5)){mx=mz=0;if(t.fake)b.target=null}
 if(b.M>=b.maxM*0.999)b.speedB=.8;else b.speedB=.85;
 moveAgent(b,mx,mz,dt);agentEat(b,dt);if(Math.random()<dt*.15)bigMouth(b);
 if(b.bigCool>0)b.bigCool-=dt}

function animAgent(a,dt,time){a.S=sizeOf(a.M);a.vis+=(a.S-a.vis)*Math.min(1,dt*5);const s=a.vis/2;a.A.g.scale.setScalar(s);a.A.g.position.set(a.x,a.y,a.z);a.A.g.rotation.y=a.face;
 const sw=Math.sin(a.phase)*.7*Math.min(1,Math.abs(Math.sin(a.phase))+.3);const moving=Math.abs(a.phase)>.01;
 a.A.legL.rotation.x=sw;a.A.legR.rotation.x=-sw;a.A.armL.rotation.x=-sw*.8;a.A.armR.rotation.x=sw*.8;
 if(!a.grounded){a.A.legL.rotation.x=.4;a.A.legR.rotation.x=-.3;a.A.armL.rotation.z=-.5;a.A.armR.rotation.z=.5}else{a.A.armL.rotation.z=0;a.A.armR.rotation.z=0}
 if(a.chew>0){a.A.armR.rotation.x=-1.2+Math.sin(time*18)*.3;a.A.armL.rotation.x=-1.0+Math.cos(time*18)*.3}
 const open=a.chew>0?(Math.floor(a.chew*7)%2===0):(a.bigCool>2.8);if(open!==a.A.open){a.A.open=open;a.A.faceM.map=open?a.A.faceB:a.A.faceA;a.A.faceM.needsUpdate=true}
 a.A.body.position.y=a.grounded&&moving?Math.abs(Math.sin(a.phase))*.06:0;
 a.A.g.visible=!(a.shield>0&&Math.floor(time*10)%2===0&&a.shield<2.9);
 a.tag.position.set(a.x,a.y+a.vis*1.18+a.vis*.12,a.z);const ts=Math.max(1.6,a.vis*.9);a.tag.scale.set(ts*2.4/1.6*.8,ts*.6/1.6*.8,1);
 const txt=a.name+' '+a.S.toFixed(1);if(txt!==a.tagTxt&&(time-(a.tagT||0)>.3)){a.tagTxt=txt;a.tagT=time;updSprite(a.tag,txt,a.isP?'#7dff8a':(a.S>P.S*1.3?'#ff8080':a.S*1.3<P.S?'#bfffbf':'#ffffff'))}
 if(a.shield>0)a.shield-=dt}

function escapeH(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function swatchesHtml(){let h='<label class="l">얼굴·손 색</label><div class="sw">'+SKINS.map(c=>'<button style="background:'+c+'" class="'+(D.skin===c?'on':'')+'" data-a="col" data-f="skin" data-c="'+c+'"></button>').join('')+'</div>';
 h+='<label class="l">윗옷 색</label><div class="sw">'+SHIRTS.map(c=>'<button style="background:'+c+'" class="'+(D.shirt===c?'on':'')+'" data-a="col" data-f="shirt" data-c="'+c+'"></button>').join('')+'</div>';
 h+='<label class="l">바지 색</label><div class="sw">'+PANTS.map(c=>'<button style="background:'+c+'" class="'+(D.pants===c?'on':'')+'" data-a="col" data-f="pants" data-c="'+c+'"></button>').join('')+'</div>';
 h+='<label class="l">표정</label><div class="sw">'+['😊 방긋','😆 싱글','😎 멋짐'].map((t,i)=>'<button class="hat '+(D.face===i?'on':'')+'" data-a="face" data-i="'+i+'">'+t+'</button>').join('')+'</div>';
 h+='<label class="l">모자</label><div class="sw">'+Object.keys(HATS).map(k=>{const H=HATS[k];const own=D.hats.includes(k);return '<button class="hat '+(D.hat===k?'on':'')+(own?'':' lock')+'" data-a="hat" data-k="'+k+'">'+H.n+(own?'':(H.cost>0?' 💰'+fmt(H.cost):' 🔒'))+'</button>'}).join('')+'</div><div id="hatMsg" style="font-size:14px;color:#ffd0d0"></div>';return h}
function codeHtml(){return X+'<h2 class="out">🎁 코드</h2><p style="font-size:16px;color:#d8ddff">비밀 코드를 넣으면 선물을 받아요! (영어 대문자)</p><div class="row"><input class="t" id="codeIn" placeholder="코드 입력" style="flex:1;text-transform:uppercase"><button class="btn purple" data-a="code">받기</button></div><div id="codeMsg" style="font-size:18px;min-height:26px"></div><p style="font-size:14px;color:#b9c4ff;margin-top:8px">힌트: 이 게임 디렉터의 이름을 영어로 써 보세요 👀 · 맛있을 때 하는 말 · 인사말</p>'}
function questHtml(){let h=X+'<h2 class="out">📜 퀘스트</h2>';QUESTS.forEach((Q,i)=>{const done=i<D.q,cur=i===D.q;let p='';if(cur){const[a,b]=qProgress();p=' ('+(Q.size?a.toFixed(1):a)+'/'+b+')'}h+='<div class="q '+(done?'done':'')+'" style="padding:4px 0;'+(cur?'color:#ffe066;font-size:18px':(!done?'opacity:.6':''))+'">'+(done?'✅':cur?'▶️':'⬜')+' '+(i+1)+'. '+Q.t+p+' — 💰'+fmt(Q.r*rebMult())+'</div>'});return h}
function setHtml(){return X+'<h2 class="out">⚙️ 설정</h2>'+
 '<div class="row"><div class="ic">🔊</div><div class="tx"><b>소리</b></div><button class="btn '+(soundOn?'':'gray')+'" data-a="snd">'+(soundOn?'켜짐':'꺼짐')+'</button></div>'+
 '<div class="row"><div class="ic">⭐</div><div class="tx"><b>부딪히면 냠냠 별 떨어뜨리기</b>끄면 큰 친구에게 부딪혀도 내 크기가 줄지 않아요</div><button class="btn '+(D.lose?'':'gray')+'" data-a="lose">'+(D.lose?'켜짐':'꺼짐')+'</button></div>'+
 '<div class="row"><div class="ic">🖼️</div><div class="tx"><b>그래픽</b>느리면 \'가볍게\'로 바꿔요 (그림자 끄기)</div><button class="btn '+(D.low?'gray':'')+'" data-a="gfx">'+(D.low?'가볍게':'예쁘게')+'</button></div>'+
 '<div class="row"><div class="ic">💾</div><div class="tx"><b>저장</b>이 브라우저에 자동으로 저장돼요</div><button class="btn blue" data-a="save">지금 저장</button></div>'+
 '<div class="row"><div class="ic">🏠</div><div class="tx"><b>사탕 공원으로 돌아가기</b></div><button class="btn blue" data-a="home">돌아가기</button></div>'+
 '<div class="row"><div class="ic">🔄</div><div class="tx"><b>처음부터 하기</b>크기·코인·업그레이드·퀘스트·모자·코드·환생 별까지 모두 처음으로 돌아가요 (이름과 색깔은 그대로)</div><button class="btn red" data-a="restart">처음부터</button></div>'+
 '<h3 style="font-weight:normal;margin-top:14px;color:#ffe066">🎬 디렉터 테스트 도구</h3><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button class="btn gold" data-a="d_coin">💰 +10만</button><button class="btn gold" data-a="d_coinB">💰 ×100</button><button class="btn" data-a="d_full">🍽️ 배 가득</button><button class="btn" data-a="d_belly">🍽️ 배 크기 +3단계</button><button class="btn blue" data-a="d_boost">⚡ 부스터 모두</button></div>'}
$('bShop').onclick=()=>openModal(shopHtml());
$('bLook').onclick=()=>openModal(lookHtml());
$('bCode').onclick=()=>openModal(codeHtml());
$('bQuest').onclick=()=>openModal(questHtml());
$('bSet').onclick=()=>openModal(setHtml());
let resetAsk=false,restartAsk=0;
function startOver(){const keep={reb:0,name:D.name,skin:D.skin,shirt:D.shirt,pants:D.pants,face:D.face,sound:D.sound,lose:D.lose,low:D.low};
 D=Object.assign({hat:'cap',hats:['none','cap','beanie'],coins:0,M:10,up:{belly:0,speed:0,grow:0,eat:0,reach:0},codes:[],q:0,cnt:{},best:2},keep);
 window.__game.D=D;
 P.M=10;P.x=0;P.z=0;P.y=0;P.vy=0;P.shield=4;boostsOn={};questStart();renderQuestMini();for(const b of bots)resetBot(b,false);applyLook();save();hud();sfx.buy();
 toast('🔄 처음부터 다시 시작! 사탕 공원에서 새로운 모험을 떠나요',2600)}
$('panel').addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;initAudio();const a=t.dataset.a;
 if(a==='close')return closeModal();
 if(a==='buy'){const k=t.dataset.k,U=UP[k],l=D.up[k],c=U.cost(l);if(l<U.max&&D.coins>=c){D.coins-=c;D.up[k]++;sfx.buy();if(k==='belly'){count('buyBelly');questCheck()}save()}else sfx.full();openModal(shopHtml())}
 if(a==='reb'){if(P.S<40)return;D.reb++;D.coins=0;D.up={belly:0,speed:0,grow:0,eat:0,reach:0};P.M=10;P.x=0;P.z=0;P.shield=5;if(!D.hats.includes('rainbow'))D.hats.push('rainbow');count('rebirth');questCheck();for(const b of bots)resetBot(b,false);sfx.buy();toast('🌟 새로 태어났어요! 이제 성장 ×'+rebMult().toFixed(1),3000);save();closeModal()}
 if(a==='col'){D[t.dataset.f]=t.dataset.c;applyLook();openModal(modalLookOrTitle())}
 if(a==='face'){D.face=+t.dataset.i;applyLook();openModal(modalLookOrTitle())}
 if(a==='hat'){const k=t.dataset.k,H=HATS[k];if(!D.hats.includes(k)){if(H.cost>0&&D.coins>=H.cost){D.coins-=H.cost;D.hats.push(k);sfx.buy()}else{const m=$('hatMsg');if(m)m.textContent=H.cost>0?'코인이 '+fmt(H.cost-D.coins)+'개 더 필요해요':H.how;return}}D.hat=k;applyLook();save();openModal(modalLookOrTitle())}
 if(a==='rename'){const v=$('nm2').value.trim().slice(0,10);if(v){D.name=v;P.name=v;P.tagTxt='';save()}openModal(lookHtml())}
 if(a==='code'){const v=$('codeIn').value.trim().toUpperCase();const m=$('codeMsg');if(!CODES[v]){m.style.color='#ffd0d0';m.textContent='앗, 그런 코드는 없어요 🤔';return}if(D.codes.includes(v)){m.style.color='#ffd0d0';m.textContent='이미 받은 코드예요!';return}D.codes.push(v);
  if(v==='CHAEA'){D.coins+=1000;if(!D.hats.includes('crown'))D.hats.push('crown')}if(v==='HELLO')D.coins+=500;if(v==='YUMMY')boostsOn.grow=120;if(v==='BIGBIG'&&D.up.belly<UP.belly.max){D.up.belly++;count('buyBelly');questCheck()}if(v==='NYAMNYAM')boostsOn.unlim=60;
  sfx.buy();m.style.color='#7dff8a';m.textContent='🎉 받았어요! '+CODES[v];save()}
 if(a==='snd'){soundOn=!soundOn;D.sound=soundOn;save();openModal(setHtml())}
 if(a==='gfx'){D.low=!D.low;applyGfx();save();openModal(setHtml())}
 if(a==='lose'){D.lose=!D.lose;save();openModal(setHtml())}
 if(a==='save'){save();toast('💾 저장했어요!',1200)}
 if(a==='home'){P.x=0;P.z=0;P.y=0;P.shield=3;closeModal()}
 if(a==='restart'){if(restartAsk!==1){restartAsk=1;t.textContent='정말요? 한 번 더!';return}restartAsk=0;startOver();closeModal();return}
 if(a==='reset'){if(!resetAsk){resetAsk=true;t.textContent='정말요? 한 번 더!';return}try{localStorage.removeItem(SAVE_KEY)}catch(e){}location.reload()}
 if(a==='d_coin'){D.coins+=100000;openModal(setHtml())}
 if(a==='d_coinB'){D.coins=Math.max(1000,D.coins)*100;openModal(setHtml())}
 if(a==='d_full'){P.M=maxM()}
 if(a==='d_belly'){D.up.belly=Math.min(UP.belly.max,D.up.belly+3);openModal(setHtml())}
 if(a==='d_boost'){for(const k in BOOSTS)boostsOn[k]=30}
 hud()});
function modalLookOrTitle(){return lookHtml()}
function applyGfx(){sun.castShadow=!D.low;renderer.setPixelRatio(D.low?1:Math.min(window.devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight)}
function applyLook(){recolor(P.A,{skin:D.skin,shirt:D.shirt,pants:D.pants,face:D.face,hat:D.hat});renderTitleSw()}

// ================= 시작 화면 =================
let playing=false;
function renderTitleSw(){const mk=(id,arr,f)=>{$(id).innerHTML=arr.map(c=>'<button style="background:'+c+'" class="'+(D[f]===c?'on':'')+'" data-c="'+c+'"></button>').join('');$(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;D[f]=b.dataset.c;applyLook()}};
 mk('swSkin',SKINS,'skin');mk('swShirt',SHIRTS,'shirt');mk('swPants',PANTS,'pants');
 $('swFace').innerHTML=['😊 방긋','😆 싱글','😎 멋짐'].map((t,i)=>'<button class="hat '+(D.face===i?'on':'')+'" data-i="'+i+'">'+t+'</button>').join('');$('swFace').onclick=e=>{const b=e.target.closest('button');if(!b)return;D.face=+b.dataset.i;applyLook()};
 $('swHat').innerHTML=D.hats.map(k=>'<button class="hat '+(D.hat===k?'on':'')+'" data-k="'+k+'">'+HATS[k].n+'</button>').join('');$('swHat').onclick=e=>{const b=e.target.closest('button');if(!b)return;D.hat=b.dataset.k;applyLook()}}
$('nameIn').value=D.name;
if(hadSave)$('saveInfo').textContent='💾 저장된 기록이 있어요: 크기 '+sizeOf(D.M).toFixed(1)+' · 💰 '+fmt(D.coins)+(D.reb?' · ★'+D.reb:'');
$('restartBtn').onclick=()=>{initAudio();const b=$('restartBtn');if(restartAsk!==2){restartAsk=2;b.textContent='정말 처음부터 할까요? 한 번 더 눌러요!';return}restartAsk=0;startOver();b.textContent='✅ 처음부터 준비 완료!';$('saveInfo').textContent='모든 기록을 지우고 새로 시작해요!';setTimeout(()=>b.classList.add('hide'),1200)};
if(hadSave)$('restartBtn').classList.remove('hide');
$('playBtn').onclick=()=>{initAudio();const v=$('nameIn').value.trim().slice(0,10);if(v){D.name=v;P.name=v;P.tagTxt=''}save();$('title').classList.add('hide');$('hud').classList.remove('hide');playing=true;P.shield=4;toast(ZONES[0].n+'에 온 걸 환영해요!',2200);sfx.buy()};

// ================= 시작! =================
buildWorld();
applyGfx();
spawnBots();
spawnBoosts();
renderTitleSw();
if(D.qb==null)questStart();
renderQuestMini();
P.M=Math.min(P.M,maxM());

const clock=new THREE.Clock();let fpsCheck=0,fpsN=0;let time=0,lbT=0,saveT=0,hudT=0,respT=0;
const camPos=new THREE.Vector3(0,10,20),camTgt=new THREE.Vector3();
function loop(){requestAnimationFrame(loop);let dt=Math.min(.05,clock.getDelta());time+=dt;
 // 플레이어
 if(playing&&!modalOpen){let mx=0,mz=0;if(keys.KeyW||keys.ArrowUp)mz-=1;if(keys.KeyS||keys.ArrowDown)mz+=1;if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;if(joyId!=null){mx=joyX;mz=joyY}
  const s=Math.sin(camYaw),c=Math.cos(camYaw);const wx=mx*c+mz*s,wz=-mx*s+mz*c;
  // 카메라 기준: 앞(W)은 카메라가 보는 쪽
  moveAgent(P,wx,wz,dt);agentEat(P,dt)}else{P.vy-=P.g()*dt;P.y=Math.max(0,P.y+P.vy*dt);if(P.y===0){P.vy=0;P.grounded=true}}
 if(P.bigCool>0)P.bigCool-=dt;
 for(const b of bots)botThink(b,dt);
 pullUpdate(dt);bumpCheck();orbUpdate(dt);boostUpdate(dt,time);popUpdate(dt);
 respT+=dt;if(respT>.25){respawnUpdate(respT);respT=0}
 for(const a of agents)animAgent(a,dt,time);
 if(P.S>D.best)D.best=P.S;
 if(playing&&fpsCheck<5){fpsCheck+=dt;fpsN++;if(fpsCheck>=5){if(fpsN/fpsCheck<24&&!D.low){D.low=true;applyGfx();save();toast('🖼️ 화면이 느려서 그래픽을 가볍게 바꿨어요',2600)}}}
 D.M=P.M;
 // 효과
 for(const p of parts){if(p.life<=0)continue;p.life-=dt;p.v.y-=p.g*dt;p.m.position.addScaledVector(p.v,dt);p.m.rotation.x+=dt*5;p.m.rotation.y+=dt*4;if(p.life<=0||p.m.position.y<0)p.m.visible=false,p.life=0}
 for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t+=dt;f.p.y+=dt*P.vis*.8;_v.copy(f.p).project(camera);if(f.t>1.1||_v.z>1){f.el.remove();floats.splice(i,1);continue}f.el.style.left=((_v.x+1)/2*innerWidth)+'px';f.el.style.top=((1-_v.y)/2*innerHeight)+'px';f.el.style.opacity=1-Math.max(0,f.t-.6)*2}
 for(const c of clouds){c.position.x+=c.userData.v*dt;if(c.position.x>1200)c.position.x=-1200}
 if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').style.opacity=0}
 // 카메라
 const S=P.vis;camTgt.set(P.x,P.y+S*.85,P.z);
 if(!playing){camYaw+=dt*.12;P.face=camYaw+0.5}
 const dist=(playing?S*3.6*zoom+2.5:S*2.4+2);
 const want=new THREE.Vector3(camTgt.x+Math.sin(camYaw)*Math.cos(camPitch)*dist,camTgt.y+Math.sin(camPitch)*dist,camTgt.z+Math.cos(camYaw)*Math.cos(camPitch)*dist);
 if(want.y<.5)want.y=.5;camPos.lerp(want,Math.min(1,dt*10));camera.position.copy(camPos);{const off=innerWidth>760?S*.9:0;camera.lookAt(playing?camTgt:new THREE.Vector3(P.x-Math.cos(camYaw)*off,P.y+S*.75,P.z+Math.sin(camYaw)*off))}
 // 그림자·안개는 크기에 맞춰
 const ext=Math.max(18,S*14);const sc=sun.shadow.camera;if(Math.abs(sc.right-ext)>ext*.15){sc.left=-ext;sc.right=ext;sc.top=ext;sc.bottom=-ext;sc.near=1;sc.far=ext*6;sc.updateProjectionMatrix()}
 sun.position.set(P.x+SUNDIR.x*ext*2.5,SUNDIR.y*ext*2.5,P.z+SUNDIR.z*ext*2.5);sun.target.position.set(P.x,0,P.z);
 scene.fog.far=Math.max(260,S*55+dist*2);scene.fog.near=scene.fog.far*.35;camera.far=scene.fog.far*1.2+200;camera.updateProjectionMatrix();
 if(playing){lockUpdate();hudT+=dt;if(hudT>.1){hud();hudT=0}lbT+=dt;if(lbT>.5){lbUpdate();lbT=0;if(QUESTS[D.q]&&QUESTS[D.q].size)questCheck();else renderQuestMini()}saveT+=dt;if(saveT>10){save();saveT=0}}
 renderer.render(scene,camera)}
addEventListener('beforeunload',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.__game={P,D,agents,objs,maxM};
loop();
})();
</script>

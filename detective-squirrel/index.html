<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>탐정 다람쥐</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#87c6ff;font-family:'Gowun Dodum',sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;color:#1b1b1b}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.j,.btn,h1,h2,h3{font-family:'Jua',sans-serif;font-weight:400}
.btn{border:3px solid #1b1b1b;border-radius:14px;padding:9px 15px;font-size:17px;background:#fff;color:#1b1b1b;box-shadow:0 4px 0 #1b1b1b;cursor:pointer;transition:transform .08s;line-height:1.2}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1b1b1b}
.btn.y{background:#ffd23f}.btn.g{background:#5fd068}.btn.b{background:#5bb8ff}.btn.r{background:#ff6b6b;color:#fff}.btn.p{background:#c792ff}.btn.o{background:#ff9f43}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 4px 0 #1b1b1b}
.hide{display:none!important}
.card{background:#fffdf6;border:4px solid #1b1b1b;border-radius:20px;box-shadow:0 7px 0 #1b1b1b}
.tok::before{content:'';width:15px;height:15px;border-radius:50%;background:#f2a900;border:2px solid #1b1b1b;box-shadow:inset -2px -2px 0 #c98a00}
#hubBtns{position:fixed;right:12px;top:64px;z-index:11;display:flex;flex-direction:column;gap:8px}
.tok{display:inline-flex;align-items:center;gap:6px;background:#ffd23f;border:3px solid #1b1b1b;border-radius:999px;padding:4px 14px;font-family:Jua;font-size:19px;box-shadow:0 3px 0 #1b1b1b}
/* menu */
#menu{position:fixed;left:28px;top:50%;transform:translateY(-50%);width:340px;padding:22px;display:flex;flex-direction:column;gap:12px}
#menu h1{margin:0;font-size:44px;line-height:1;text-shadow:3px 3px 0 #ffd23f}
#menu .sub{font-size:15px;opacity:.8;margin-top:-4px}
#menu .btn{font-size:21px;padding:12px}
@media (max-width:760px){#menu{left:50%;top:auto;bottom:14px;transform:translateX(-50%);width:min(94vw,380px);padding:14px;gap:8px}#menu h1{font-size:34px}#menu .btn{font-size:18px;padding:9px}}
@media (max-height:520px) and (orientation:landscape){#menu{top:10px;transform:none;bottom:auto;left:14px;width:300px;padding:12px;gap:6px}#menu h1{font-size:30px}#menu .btn{font-size:16px;padding:7px}}
.over{position:fixed;inset:0;background:rgba(20,20,40,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:12px}
.over>.card{width:min(860px,96vw);max-height:92vh;overflow:auto;padding:20px;touch-action:pan-y}
.over h2{margin:0 0 10px;font-size:30px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{flex:1;min-width:110px}
.tab.on{background:#ffd23f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.case{border:3px solid #1b1b1b;border-radius:16px;padding:14px;background:#fff;cursor:pointer;box-shadow:0 4px 0 #1b1b1b;position:relative}
.case:active{transform:translateY(3px);box-shadow:0 1px 0 #1b1b1b}
.case .em{font-size:40px}.case h3{margin:4px 0;font-size:20px}
.case .rw{font-size:14px;opacity:.85}
.case.lock{background:#ddd;cursor:default;opacity:.7}
.case .badge{position:absolute;top:10px;right:10px;background:#5fd068;border:2px solid #1b1b1b;border-radius:10px;padding:2px 8px;font-family:Jua;font-size:14px}
.shopItem{border:3px solid #1b1b1b;border-radius:16px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 #1b1b1b}
.shopItem .em{font-size:34px}.shopItem h3{margin:0;font-size:19px}.shopItem p{margin:0;font-size:14px;opacity:.85;flex:1}
.lockmsg{font-size:14px;margin:-6px 0 10px;opacity:.85}
/* hud */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud>*{pointer-events:auto}
#hTitle{position:fixed;left:12px;top:12px;padding:8px 14px;font-family:Jua;font-size:18px;max-width:52vw}
#hTitle small{display:block;font-size:14px;opacity:.8;font-family:'Gowun Dodum'}
#tokBox{position:fixed;right:12px;top:12px;z-index:31}
#zone{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font-family:Jua;padding:6px 16px;border-radius:999px;font-size:16px;white-space:nowrap}
#side{position:fixed;right:12px;top:64px;display:flex;flex-direction:column;gap:8px;width:150px}
#side .btn{font-size:15px;padding:7px 8px;text-align:left}
#act{position:fixed;right:24px;bottom:28px;min-width:150px;font-size:20px;padding:14px 18px;background:#ffd23f;border-radius:18px;white-space:pre-line;text-align:center}
#joy{position:fixed;left:130px;bottom:34px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid rgba(0,0,0,.35);touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.85);border:3px solid #1b1b1b}
#keys{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(0,0,0,.45);color:#fff;font-size:13px;padding:5px 12px;border-radius:999px;white-space:nowrap}
#jump{position:fixed;right:190px;bottom:30px;width:64px;height:64px;border-radius:50%;font-size:14px;padding:0}
@media (max-width:760px){#side{width:118px;top:58px}#side .btn{font-size:13px;padding:6px}#hTitle{font-size:15px}#act{font-size:17px;min-width:120px;right:14px;bottom:20px}#jump{right:150px}}
@media (max-height:520px){#side{top:54px;gap:5px}#side .btn{font-size:12px;padding:4px 6px}#joy{width:110px;height:110px;left:100px;bottom:16px}#knob{left:30px;top:30px}}
/* modal */
#modal{z-index:40}
#modal .card{width:min(560px,94vw);padding:20px}
#mBody{font-size:17px;line-height:1.55}
#mBody h2{margin:0 0 8px;font-size:26px}
#mBtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:flex-end}
.qbtn{display:block;width:100%;text-align:left;margin:6px 0;font-size:16px}
.ans{background:#f1f6ff;border:2px solid #1b1b1b;border-radius:12px;padding:10px 12px;margin:8px 0}
.ans i{display:block;color:#b03a2e;margin-top:4px;font-style:normal;font-weight:bold}
.info{background:#fff7d6;border:2px dashed #1b1b1b;border-radius:12px;padding:8px 12px;margin:8px 0}
.clueRow{border-bottom:2px dashed #ccc;padding:6px 0}
.sus{display:flex;align-items:center;gap:10px}
textarea{width:100%;min-height:90px;border:3px solid #1b1b1b;border-radius:12px;padding:8px;font-family:'Gowun Dodum';font-size:15px;user-select:text;-webkit-user-select:text}
#banner{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);font-family:Jua;font-size:min(9vw,60px);color:#fff;-webkit-text-stroke:3px #1b1b1b;text-shadow:0 5px 0 #1b1b1b;white-space:nowrap;z-index:35;pointer-events:none;animation:pop 2.4s ease forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}15%{transform:translate(-50%,-50%) scale(1.1);opacity:1}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:45;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.t{background:#1b1b1b;color:#fff;font-family:Jua;padding:8px 16px;border-radius:12px;font-size:16px;animation:tf 2.6s forwards}
@keyframes tf{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:25;transition:opacity .18s}
#rotate{position:fixed;inset:0;z-index:100;background:#2b2140;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:Jua;font-size:26px;text-align:center;padding:20px}
#rotate small{font-family:'Gowun Dodum';font-size:15px;opacity:.85}
#rotate .phone{width:60px;height:100px;border:5px solid #fff;border-radius:12px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
body.portrait #rotate{display:flex}
@media (max-height:520px) and (orientation:landscape){#hTitle{font-size:14px;padding:5px 10px;top:8px;left:8px;max-width:40vw}#hTitle small{font-size:12px}#zone{top:8px;font-size:13px;padding:4px 12px}#tokBox{top:8px;right:8px}.tok{font-size:15px;padding:2px 10px}#side{top:46px;right:8px;width:112px}#hubBtns{top:46px;right:8px}#hubBtns .btn{font-size:13px;padding:5px 8px}#act{right:12px;bottom:12px;font-size:15px;padding:9px 12px;min-width:110px}#jump{right:136px;bottom:14px;width:54px;height:54px}.over>.card{max-height:94vh;padding:12px}.over h2,#mBody h2{font-size:21px}#mBody{font-size:15px}.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}.case,.shopItem{padding:9px}}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:Jua;font-size:26px;background:#87c6ff;z-index:99}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rotate"><div class="phone"></div><div>화면을 <b>가로</b>로 돌려 주세요</div><small>가로로 돌리면 탐정 다람쥐를 할 수 있어요</small></div>
<div id="loading">탐정 사무소 문 여는 중...</div>

<div id="cases" class="over hide"><div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2 id="casesTitle">사건 고르기</h2><span class="tok"><span class="tokN">0</span> 토큰</span></div>
  <div class="lockmsg" id="lockMsg"></div>
  <div class="grid" id="caseGrid"></div>
  <div style="text-align:right;margin-top:14px"><button class="btn" data-close="cases">닫기</button></div>
</div></div>

<div id="shop" class="over hide"><div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2>상점 · 옷장</h2><span class="tok"><span class="tokN">0</span> 토큰</span></div>
  <h3 style="margin:4px 0 8px">탐정 도구</h3>
  <div class="grid" id="toolGrid"></div>
  <h3 style="margin:16px 0 8px">다람쥐 스킨</h3>
  <div class="grid" id="skinGrid"></div>
  <div style="text-align:right;margin-top:14px"><button class="btn" data-close="shop">닫기</button></div>
</div></div>

<div id="hud" class="hide">
  <div id="hTitle" class="card"></div>
  <div id="zone"></div>
  <div id="side">
    <button class="btn" id="bBrief">사건 내용</button>
    <button class="btn" id="bNote">기록 노트</button>
    <button class="btn" id="bHint">힌트 노트</button>
    <button class="btn r" id="bAccuse">범인 지목</button>
    <button class="btn" id="bExit">나가기</button>
  </div>
  <button class="btn hide" id="act"></button>
  <button class="btn hide" id="jump">점프</button>
  <div id="joy" class="hide"><div id="knob"></div></div>
  <div id="keys">WASD·방향키 이동 · 마우스 드래그 화면 돌리기 · E 조사/질문 · 스페이스 점프</div>
</div>
<div id="hubBtns" class="hide"><button class="btn" id="bHelp">도움말</button><button class="btn r" id="bReset">처음부터 하기</button></div>
<div id="tokBox" class="hide"><span class="tok"><span class="tokN">0</span> 토큰</span></div>

<div id="modal" class="over hide"><div class="card"><div id="mBody"></div><div id="mBtns"></div></div></div>
<div id="toast"></div>
<div id="fade"></div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
if(typeof THREE==='undefined'){ $('loading').textContent='게임을 불러오지 못했어요. 새로고침해 주세요!'; return; }

/* ================= 저장 ================= */
const KEY='detectiveSquirrel_v1';
const DEF={tokens:0,solved:{},hint:0,note:false,skins:['basic'],skin:'basic',power:{easy:0,medium:0,hard:0},memo:{}};
let S;
function load(){ try{ const t=localStorage.getItem(KEY); S=Object.assign(JSON.parse(JSON.stringify(DEF)), t?JSON.parse(t):{}); }catch(e){ S=JSON.parse(JSON.stringify(DEF)); } S.power=Object.assign({easy:0,medium:0,hard:0},S.power||{}); }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
load();
function setTok(){ document.querySelectorAll('.tokN').forEach(e=>e.textContent=S.tokens); }
function addTok(n){ S.tokens=Math.max(0,S.tokens+n); save(); setTok(); }

/* ================= 소리 ================= */
let AC=null;
function tone(f,d=0.12,type='sine',v=0.12,delay=0){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); const t=AC.currentTime+delay; const o=AC.createOscillator(),g=AC.createGain(); o.type=type;o.frequency.value=f; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+d); o.connect(g);g.connect(AC.destination); o.start(t); o.stop(t+d+0.02);}catch(e){} }
const SFX={ clue(){tone(660,.1,'triangle');tone(990,.18,'triangle',.12,.1);}, click(){tone(520,.06,'square',.05);},
 good(){[523,659,784,1046].forEach((f,i)=>tone(f,.22,'triangle',.13,i*.11));}, bad(){tone(300,.25,'sawtooth',.08);tone(200,.35,'sawtooth',.08,.18);},
 coin(){tone(880,.08,'square',.06);tone(1320,.15,'square',.06,.07);}, warp(){tone(400,.15,'sine',.1);tone(800,.2,'sine',.1,.1);} };

/* ================= THREE 기본 ================= */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,1,0.1,300);
const hemi=new THREE.HemisphereLight(0xe8f4ff,0x9a8a74,0.75); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2dc,0.85); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); const sc=sun.shadow.camera; sc.left=-30;sc.right=30;sc.top=30;sc.bottom=-30;sc.near=1;sc.far=80; sun.shadow.bias=-0.0008;
scene.add(sun); scene.add(sun.target);
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();

const BOXG=new THREE.BoxGeometry(1,1,1); BOXG._shared=true;
const SG=new THREE.SphereGeometry(1,22,16); SG._shared=true;
const LPS=new THREE.IcosahedronGeometry(1,1); LPS._shared=true;
const PLG=new THREE.PlaneGeometry(1,1); PLG._shared=true;
const CIRG=new THREE.CircleGeometry(1,20); CIRG._shared=true;
const MC={}; function M(c){ if(!MC[c]){ MC[c]=new THREE.MeshLambertMaterial({color:c}); MC[c]._shared=true; } return MC[c]; }
const GC={}; function cylG(a,b,h,s){ const k=a+'_'+b+'_'+h+'_'+s; if(!GC[k]){GC[k]=new THREE.CylinderGeometry(a,b,h,s);GC[k]._shared=true;} return GC[k]; }

const K=1.6; let G2=null, pads=[];
let G=null, cols=[], fades=[], inter=[], zones=[], portals=[], anims=[], npcs=[], bounds={x0:-50,x1:50,z0:-50,z1:50}, outdoorName='바깥';
function disposeObj(o){ if(o.geometry&&!o.geometry._shared) o.geometry.dispose(); if(o.material){ (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ if(!m._shared){ if(m.map&&!m.map._shared) m.map.dispose(); m.dispose(); } }); } }
function newLevel(){ if(G){ scene.remove(G); G.traverse(disposeObj); } if(G2){ scene.remove(G2); G2.traverse(disposeObj); } G=new THREE.Group(); G.scale.set(K,1,K); scene.add(G); G2=new THREE.Group(); scene.add(G2); pads=[]; cols=[];fades=[];inter=[];zones=[];portals=[];anims=[];npcs=[]; bounds={x0:-50,x1:50,z0:-50,z1:50}; outdoorName='바깥'; }

function addCol(x,z,w,d){ cols.push({x0:(x-w/2)*K,x1:(x+w/2)*K,z0:(z-d/2)*K,z1:(z+d/2)*K}); }
function addColW(x,z,w,d){ cols.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2}); }
function scaleBounds(){ bounds={x0:bounds.x0*K,x1:bounds.x1*K,z0:bounds.z0*K,z1:bounds.z1*K}; }
function colRot(x,z,w,d,ry){ const s=Math.abs(Math.sin(ry||0))>0.7; addCol(x,z,s?d:w,s?w:d); }
function box(w,h,d,col,x,y,z,o={}){
  const mt=o.mat||(o.fade?new THREE.MeshLambertMaterial({color:col,transparent:true}):M(col));
  const m=new THREE.Mesh(BOXG,mt); m.scale.set(w,h,d); m.position.set(x,y,z);
  if(o.ry) m.rotation.y=o.ry; if(o.rx) m.rotation.x=o.rx; if(o.rz) m.rotation.z=o.rz;
  m.castShadow=o.cast!==false; m.receiveShadow=true; (o.p||G).add(m);
  if(o.c) colRot(x,z,w,d,o.ry); if(o.fade) fades.push(m); return m; }
function cyl(a,b,h,col,x,y,z,o={}){ const m=new THREE.Mesh(cylG(a,b,h,o.seg||16),o.mat||M(col)); m.position.set(x,y,z); if(o.rx)m.rotation.x=o.rx; if(o.rz)m.rotation.z=o.rz; if(o.ry)m.rotation.y=o.ry; m.castShadow=o.cast!==false; m.receiveShadow=true; (o.p||G).add(m); if(o.c) addCol(x,z,b*2,b*2); return m; }
function sph(r,col,x,y,z,o={}){ const m=new THREE.Mesh(SG,o.mat||M(col)); m.position.set(x,y,z); const s=o.s||[1,1,1]; m.scale.set(r*s[0],r*s[1],r*s[2]); m.castShadow=o.cast!==false; (o.p||G).add(m); return m; }
function flat(w,d,col,x,z,o={}){ const mt=o.mat||new THREE.MeshLambertMaterial({color:col,polygonOffset:true,polygonOffsetFactor:-2,transparent:o.op!=null,opacity:o.op==null?1:o.op,emissive:o.em||0}); const m=new THREE.Mesh(o.circle?CIRG:PLG,mt); m.rotation.x=-Math.PI/2; m.rotation.z=o.rz||0; m.scale.set(w,d,1); m.position.set(x,o.y==null?0.015:o.y,z); m.receiveShadow=true; (o.p||G).add(m); return m; }
function vplane(w,h,col,x,y,z,ry,o={}){ const mt=new THREE.MeshLambertMaterial({color:col,polygonOffset:true,polygonOffsetFactor:-2,side:THREE.DoubleSide,emissive:o.em||0,transparent:o.op!=null,opacity:o.op==null?1:o.op,map:o.map||null}); const m=new THREE.Mesh(o.circle?CIRG:PLG,mt); m.scale.set(w,h,1); m.position.set(x,y,z); m.rotation.y=ry||0; if(o.rz) m.rotation.z=o.rz; (o.p||G).add(m); return m; }
function grp(x,z,ry){ const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=ry||0; G.add(g); return g; }

/* 글자 스프라이트 */
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function makeLabel(text,o={}){
  const fs=o.fs||44, cv=document.createElement('canvas'), ctx=cv.getContext('2d');
  ctx.font=`${fs}px Jua, sans-serif`; const tw=Math.ceil(ctx.measureText(text).width);
  cv.width=tw+fs*0.9; cv.height=fs*1.55; ctx.font=`${fs}px Jua, sans-serif`;
  if(o.bg!==null){ ctx.fillStyle=o.bg||'rgba(0,0,0,.6)'; rr(ctx,2,2,cv.width-4,cv.height-4,fs*0.45); ctx.fill(); if(o.stroke){ctx.lineWidth=4;ctx.strokeStyle=o.stroke;ctx.stroke();} }
  ctx.fillStyle=o.fg||'#fff'; ctx.textBaseline='middle'; ctx.textAlign='center'; ctx.fillText(text,cv.width/2,cv.height/2+2);
  const tex=new THREE.CanvasTexture(cv); tex.minFilter=THREE.LinearFilter;

function collide(){ const r=0.42; for(const c of cols){ const nx=Math.max(c.x0,Math.min(P.x,c.x1)), nz=Math.max(c.z0,Math.min(P.z,c.z1)); const dx=P.x-nx, dz=P.z-nz, d2=dx*dx+dz*dz; if(d2<r*r){ if(d2>1e-6){ const d=Math.sqrt(d2); P.x=nx+dx/d*r; P.z=nz+dz/d*r; } else { const l=P.x-c.x0,rt=c.x1-P.x,t=P.z-c.z0,b=c.z1-P.z,m=Math.min(l,rt,t,b); if(m===l)P.x=c.x0-r; else if(m===rt)P.x=c.x1+r; else if(m===t)P.z=c.z0-r; else P.z=c.z1+r; } } } P.x=Math.max(bounds.x0,Math.min(bounds.x1,P.x)); P.z=Math.max(bounds.z0,Math.min(bounds.z1,P.z)); }

function talk(s){

  if(!S.note){ modal(`<h2>기록 노트</h2><p>기록 노트가 있으면 찾은 단서와 용의자의 대답이 자동으로 적히고, 나만의 메모도 쓸 수 있어요.</p>`,[{t:'지금 사기 (30토큰)',c:'y',dis:S.tokens<30,fn:()=>{ addTok(-30); S.note=true; save(); updHud(); SFX.coin(); toast('기록 노트를 샀어요!'); note(); }},{t:'닫기'}]); return; }
  let h=`<h2>기록 노트</h2><b>찾은 단서 (${R.found.size}/${c.clues.length})</b>`;
  const fs=c.clues.filter(x=>R.found.has(x.id)); h+=fs.length?fs.map(x=>`<div class="clueRow"><b>${x.name}</b><br>${x.text}</div>`).join(''):'<p>아직 찾은 단서가 없어요.</p>';
  h+=`<div style="margin-top:10px"><b>용의자의 대답</b></div>`; let any=false;
  c.suspects.forEach(s=>{ (R.asked[s.id]||[]).forEach(i=>{ any=true; h+=ansHTML(s,i); }); }); if(!any) h+='<p>아직 질문하지 않았어요.</p>';
  h+=`<div style="margin-top:10px"><b>나의 메모</b></div><textarea id="memo" placeholder="생각나는 것을 자유롭게 적어 보세요!">${(S.memo[c.id]||'').replace(/</g,'&lt;')}</textarea>`;
  modal(h,[{t:'닫기'}]); const ta=$('memo'); ta.addEventListener('input',()=>{ S.memo[c.id]=ta.value; save(); });
}

$('bExit').onclick=()=>{ SFX.click(); modal('<h2>사건을 그만둘까요?</h2><p>지금 나가면 이번 조사 기록(찾은 단서, 질문)은 사라져요. 토큰은 그대로예요.</p>',[{t:'계속 조사하기',c:'y'},{t:'나가기',c:'r',fn:()=>goHub()}]); };

/* ================= 화면 ================= */
function closeOverlays(){ ['cases','shop'].forEach(i=>$(i).classList.add('hide')); }
function uiOpen(){ return modalOpen||!$('cases').classList.contains('hide')||!$('shop').classList.contains('hide'); }
function showScreen(s){ const play=s==='play'; $('hud').classList.remove('hide'); $('hTitle').classList.toggle('hide',!play); $('side').classList.toggle('hide',!play); $('hubBtns').classList.toggle('hide',play); $('tokBox').classList.remove('hide'); closeOverlays(); $('joy').classList.toggle('hide',!isTouch); $('jump').classList.toggle('hide',!isTouch); $('keys').classList.toggle('hide',isTouch); $('act').classList.add('hide'); curAct=null; }
function goHub(){ R=null; mode='hub'; closeModal(); buildHub(); P.x=0; P.z=7*K; P.y=0; P.vy=0; P.face=Math.PI; yaw=0; dist=11; pitch=0.4; snapCam=true; lastZone=''; showScreen('hub'); setTok(); }
function unlocked(d){ if(d==='easy') return true; if(d==='medium') return ['e1','e2','e3'].filter(i=>S.solved[i]).length>=2; return ['m1','m2'].filter(i=>S.solved[i]).length>=1; }
function openDiff(d){
  if(!unlocked(d)){ SFX.bad(); const n=d==='medium'?['e1','e2','e3'].filter(i=>S.solved[i]).length:['m1','m2'].filter(i=>S.solved[i]).length; modal(`<h2>${DIFF[d].name} 발판은 아직 잠겨 있어요</h2><p>${d==='medium'?`이지 사건을 2개 해결하면 열려요. (지금 ${n}/2)`:`미디움 사건을 1개 해결하면 열려요. (지금 ${n}/1)`}</p>`,[{t:'알겠어요',c:'y'}]); return; }
  SFX.warp(); $('casesTitle').textContent=DIFF[d].name+' 사건';
  $('lockMsg').textContent={easy:'이지 사건 3개 중 2개를 해결하면 미디움이 열려요.',medium:'미디움 사건 2개 중 1개를 해결하면 하드가 열려요.',hard:'최고 난이도예요. 함정 단서를 조심하세요!'}[d];
  const g=$('caseGrid'); g.innerHTML='';
  CASES.filter(c=>c.diff===d).forEach(c=>{ const el=document.createElement('div'); el.className='case'; const done=S.solved[c.id];
    el.innerHTML=`${done?'<span class="badge">해결</span>':''}<h3 style="margin-top:${done?'22px':'4px'}">${c.title}</h3><div class="rw">해결하면 ${done?Math.round(c.reward*0.2)+'토큰 (다시 풀기)':c.reward+'토큰'} · 틀리면 -${c.pen}토큰<br>용의자 ${c.suspects.length}명 · 단서 ${c.clues.length}개</div><div style="margin-top:10px"><span class="btn y" style="display:inline-block;font-size:15px;padding:6px 12px">이 사건 시작하기</span></div>`;
    el.onclick=()=>startCase(c.id); g.appendChild(el); });
  $('cases').classList.remove('hide');
}
function openShop(){ SFX.coin(); $('shop').classList.remove('hide'); renderShop(); }
function renderShop(){
  const tg=$('toolGrid'); tg.innerHTML='';
  const tools=[
   {em:'',n:'힌트 노트',p:50,d:`사건 중에 힌트를 볼 수 있어요. 한 권에 2번! (지금 ${S.hint}번 남음)`,buy:()=>{S.hint+=2;},b:'구매하기'},
   {em:'',n:'기록 노트',p:30,d:'찾은 단서와 용의자의 대답이 자동으로 적히고, 메모도 쓸 수 있어요.',buy:()=>{S.note=true;},own:S.note,b:'구매하기'},
   {em:'',n:'질문의 힘',p:40,d:`사건 중 용의자 한 명에게 질문 2개를 할 수 있어요. 난이도별로 딱 2번! (이지 ${S.power.easy}/2 · 미디움 ${S.power.medium}/2 · 하드 ${S.power.hard}/2)`,info:'사건 중 용의자 질문 창에서 사용'}];
  tools.forEach(t=>{ const d=document.createElement('div'); d.className='shopItem'; d.innerHTML=`<h3>${t.n} · ${t.p}</h3><p>${t.d}</p>`; const b=document.createElement('button'); b.className='btn y';
    if(t.info){ b.textContent=t.info; b.disabled=true; } else if(t.own){ b.textContent='가지고 있어요'; b.disabled=true; } else { b.textContent=`${t.b} (${t.p})`; b.disabled=S.tokens<t.p; b.onclick=()=>{ addTok(-t.p); t.buy(); save(); SFX.coin(); toast(`${t.em} ${t.n}을(를) 샀어요!`); renderShop(); }; }
    d.appendChild(b); tg.appendChild(d); });
  const sg=$('skinGrid'); sg.innerHTML='';
  Object.keys(SK).forEach(k=>{ const s=SK[k],own=S.skins.includes(k),on=S.skin===k; const d=document.createElement('div'); d.className='shopItem'; d.innerHTML=`<h3>${s.name}</h3><p>${s.price?''+s.price+' 토큰':'처음부터 가지고 있어요'}</p>`; const b=document.createElement('button');
    if(on){ b.className='btn g'; b.textContent='입는 중'; b.disabled=true; }
    else if(own){ b.className='btn b'; b.textContent='입기'; b.onclick=()=>{ S.skin=k; save(); setSkin(k); SFX.click(); renderShop(); }; }
    else { b.className='btn y'; b.textContent=`구매 (${s.price})`; b.disabled=S.tokens<s.price; b.onclick=()=>{ addTok(-s.price); S.skins.push(k); S.skin=k; save(); setSkin(k); SFX.coin(); toast(`${s.em} ${s.name}이 되었어요!`); renderShop(); }; }
    d.appendChild(b); sg.appendChild(d); });
}

<p><b>이동</b>: WASD·방향키 (태블릿은 왼쪽 아래 조이스틱)<br><b>화면 돌리기</b>: 화면을 끌기 · 마우스 휠로 확대/축소<br><b>조사</b>: 노란 <b>?</b> 표시에 다가가서 E 키 또는 오른쪽 아래 버튼<br><b>질문</b>: 용의자에게 다가가서 질문 (보통 한 명당 1번)<br><b>범인 지목</b>: 오른쪽 버튼. 틀리면 토큰이 줄고, 용의자 수만큼 기회가 있어요</p>

<p><b>상점</b><br>힌트 노트 50토큰 (2번 사용) · 기록 노트 30토큰<br>질문의 힘 40토큰 (용의자 한 명에게 질문 2개, 난이도별 2번까지)<br>리본 · 연한 갈색 50토큰 / 황금 · 정장 80토큰</p>

$('bReset').onclick=()=>{ SFX.click(); modal('<h2>처음부터 할까요?</h2><p>모든 기록이 지워지고 처음 상태로 돌아가요.</p><div class="info">해결한 사건, 토큰, 힌트 노트, 기록 노트, 질문의 힘 사용 횟수, 산 스킨, 메모가 모두 사라져요. 되돌릴 수 없어요.</div>',[{t:'아니요, 계속할래요',c:'y'},{t:'처음부터 하기',c:'r',fn:()=>{ const k=JSON.parse(JSON.stringify(DEF)); Object.keys(S).forEach(x=>delete S[x]); Object.assign(S,k); save(); setSkin('basic'); goHub(); toast('처음부터 다시 시작해요!'); }}]); };
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{ SFX.click(); $(b.dataset.close).classList.add('hide'); });

/* ================= 루프 ================= */
const clock=new THREE.Clock(); let T=0, lastZone='';
const ray=new THREE.Raycaster(); const tmpV=new THREE.Vector3(), headV=new THREE.Vector3();
function zoneAt(x,z){ for(const zn of zones){ if(x>=zn.x0&&x<=zn.x1&&z>=zn.z0&&z<=zn.z1) return zn.name; } return outdoorName; }
function teleport(p){ const f=$('fade'); f.style.opacity=1; SFX.warp(); setTimeout(()=>{ P.x=p.tx; P.z=p.tz; yaw=p.tyaw; portals.forEach(q=>q.inside=Math.hypot(P.x-q.x,P.z-q.z)<q.r); f.style.opacity=0; },180); }
let snapCam=false;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05); T+=dt;
  const ud=player.userData, busy=uiOpen();
  let ix=0,iz=0;
  if(!busy){ if(keys.KeyW||keys.ArrowUp) iz+=1; if(keys.KeyS||keys.ArrowDown) iz-=1; if(keys.KeyA||keys.ArrowLeft) ix-=1; if(keys.KeyD||keys.ArrowRight) ix+=1; if(joy.x||joy.y){ ix+=joy.x; iz-=joy.y; } }
  const l=Math.hypot(ix,iz); let moving=false;
  if(l>0.1){ if(l>1){ix/=l;iz/=l;} const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw); const mx=fx*iz+rx*ix, mz=fz*iz+rz*ix, sp=7; P.x+=mx*sp*dt; P.z+=mz*sp*dt; const target=Math.atan2(mx,mz); let d=target-P.face; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2; P.face+=d*Math.min(1,dt*12); moving=true; }
  collide();
  P.vy-=20*dt; P.y+=P.vy*dt; if(P.y<0){P.y=0;P.vy=0;}
  P.walk+=moving?dt*11:0;
  player.position.set(P.x,P.y+(moving?Math.abs(Math.sin(P.walk))*0.08:0),P.z); player.rotation.y=P.face;
  ud.tail.rotation.x=Math.sin(T*(moving?9:2.5))*(moving?0.18:0.07); ud.bodyG.rotation.z=moving?Math.sin(P.walk)*0.05:0;
  for(const p of portals){ const ins=Math.hypot(P.x-p.x,P.z-p.z)<p.r; if(ins&&!p.inside&&!busy){ p.inside=true; teleport(p); break; } p.inside=ins; }
  for(const p of pads){ const ins=P.x>p.x0&&P.x<p.x1&&P.z>p.z0&&P.z<p.z1; if(ins&&!p.inside&&!busy){ p.inside=true; p.fn(); } else p.inside=ins; }
  const ch=Math.sin(pitch)*dist, cd=Math.cos(pitch)*dist;
  tmpV.set(P.x+Math.sin(yaw)*cd,P.y+1.2+ch,P.z+Math.cos(yaw)*cd);
  if(snapCam){ camera.position.copy(tmpV); snapCam=false; } else camera.position.lerp(tmpV,Math.min(1,dt*10));
  camera.lookAt(P.x,P.y+1.3,P.z);
  headV.set(P.x,P.y+1.2,P.z); const dir=headV.clone().sub(camera.position); const dl=dir.length(); dir.normalize(); ray.set(camera.position,dir); ray.far=dl;
  const hits=new Set(ray.intersectObjects(fades,false).map(h=>h.object));
  for(const m of fades){ const tgt=hits.has(m)?0.18:1; m.material.opacity+=(tgt-m.material.opacity)*Math.min(1,dt*10); m.material.depthWrite=m.material.opacity>0.95; }
  const n=busy?null:nearest(); if(n!==curAct){ curAct=n; const a=$('act'); if(!n) a.classList.add('hide'); else { a.classList.remove('hide'); a.textContent=n.type==='clue'?((R&&R.found.has(n.data.id))?'다시 보기\n':'조사하기\n')+n.data.name:n.type==='sus'?'질문하기\n'+n.data.name:'이야기하기\n'+n.data.name; } }
  const zn=zoneAt(P.x,P.z); if(zn!==lastZone){ lastZone=zn; $('zone').textContent=zn; }
  sun.position.set(P.x+12,24,P.z+9); sun.target.position.set(P.x,0,P.z);
  for(const a of anims) a(T,dt);
  for(const q of npcs){ if(q.cat){ q.m.userData.tail&&(q.m.userData.tail.rotation.y=Math.sin(T*2+q.ph)*0.5); } else q.m.position.y=Math.abs(Math.sin(T*1.5+q.ph))*0.03; }
  renderer.render(scene,camera);
}

/* ================= 시작 ================= */
function checkOrient(){ document.body.classList.toggle('portrait',isTouch&&innerHeight>innerWidth); }
addEventListener('resize',checkOrient); addEventListener('orientationchange',()=>setTimeout(checkOrient,200));
let triedLock=false; addEventListener('pointerdown',()=>{ if(triedLock||!isTouch) return; triedLock=true; try{ const el=document.documentElement; const go=()=>{ try{ screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} }; if(el.requestFullscreen) el.requestFullscreen().then(go).catch(go); else go(); }catch(e){} },{capture:true});
function boot(){ checkOrient(); makeMarkTex(); goHub(); $('loading').remove(); loop(); window.__game={S,CASES,startCase,judge:id=>judge(R.c.suspects.find(s=>s.id===id)),get R(){return R;},P}; }
if(document.fonts&&document.fonts.load){ Promise.race([document.fonts.load('40px Jua'),new Promise(r=>setTimeout(r,1500))]).then(boot,boot); } else boot();
})();
